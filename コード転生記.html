<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>コード転生記 — 期末試験クエスト</title>
</head>
<body>
<style>
  :root{
    --bg:#f3ead9;
    --bg-2:#ece0c8;
    --panel:#fbf4e4;
    --panel-2:#f1e5c8;
    --ink:#2b2318;
    --ink-dim:#6b5b3e;
    --accent:#a8752c;
    --accent-ink:#fff8ec;
    --hero:#3f7a4a;
    --danger:#a33f2d;
    --line:rgba(168,117,44,0.35);
    --shadow:rgba(43,35,24,0.18);
    --code-bg:#efe3ca;
    --code-ink:#3a2f1d;
    --font-display:"Hiragino Mincho ProN","YuMincho","Yu Mincho",Georgia,serif;
    --font-body:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",system-ui,-apple-system,sans-serif;
    --font-mono:ui-monospace,"SF Mono","Cascadia Code",Consolas,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#171225;
      --bg-2:#1f1830;
      --panel:#241b36;
      --panel-2:#2c2140;
      --ink:#f1e9d8;
      --ink-dim:#cbb99a;
      --accent:#e0a458;
      --accent-ink:#2b1c08;
      --hero:#7fb685;
      --danger:#e2765f;
      --line:rgba(224,164,88,0.35);
      --shadow:rgba(0,0,0,0.45);
      --code-bg:#120f1e;
      --code-ink:#e9e1c9;
    }
  }
  :root[data-theme="dark"]{
    --bg:#171225; --bg-2:#1f1830; --panel:#241b36; --panel-2:#2c2140;
    --ink:#f1e9d8; --ink-dim:#cbb99a; --accent:#e0a458; --accent-ink:#2b1c08;
    --hero:#7fb685; --danger:#e2765f; --line:rgba(224,164,88,0.35); --shadow:rgba(0,0,0,0.45);
    --code-bg:#120f1e; --code-ink:#e9e1c9;
  }
  :root[data-theme="light"]{
    --bg:#f3ead9; --bg-2:#ece0c8; --panel:#fbf4e4; --panel-2:#f1e5c8;
    --ink:#2b2318; --ink-dim:#6b5b3e; --accent:#a8752c; --accent-ink:#fff8ec;
    --hero:#3f7a4a; --danger:#a33f2d; --line:rgba(168,117,44,0.35); --shadow:rgba(43,35,24,0.18);
    --code-bg:#efe3ca; --code-ink:#3a2f1d;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 60%),
      radial-gradient(ellipse 900px 600px at 90% 110%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    line-height:1.6;
    padding:32px 18px 64px;
  }
  h1,h2,h3{font-family:var(--font-display); text-wrap:balance; margin:0;}
  .num{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
  ::selection{background:var(--accent); color:var(--accent-ink);}
  :focus-visible{outline:2px solid var(--accent); outline-offset:3px;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important;}
  }

  .stage{max-width:920px; margin:0 auto;}

  /* ---- top bar ---- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    margin-bottom:26px; flex-wrap:wrap;
  }
  .brand{display:flex; align-items:baseline; gap:10px;}
  .brand .glyph{font-size:1.6rem;}
  .brand h1{font-size:1.5rem; letter-spacing:.02em;}
  .brand small{display:block; font-size:.75rem; color:var(--ink-dim); letter-spacing:.12em; text-transform:uppercase; margin-top:2px;}
  .tally{
    display:flex; align-items:center; gap:10px;
    font-family:var(--font-mono); font-size:.85rem; color:var(--ink-dim);
    background:var(--panel); border:1px solid var(--line); padding:8px 14px;
    clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
  }
  .tally .stars{color:var(--accent); letter-spacing:.05em;}

  /* ---- frame / card base ---- */
  .frame{
    background:var(--panel);
    border:1px solid var(--line);
    box-shadow:0 10px 28px -14px var(--shadow);
    clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px);
  }

  /* ---- map screen ---- */
  .intro{padding:22px 26px; margin-bottom:26px;}
  .intro p{margin:.5em 0 0; max-width:64ch; color:var(--ink-dim);}
  .intro h2{font-size:1.3rem; margin-bottom:4px;}

  .alttoggle{
    display:flex; align-items:center; gap:14px; width:100%; text-align:left; cursor:pointer;
    background:var(--panel); border:1px solid var(--line); color:var(--ink); padding:14px 18px; margin-bottom:16px;
    clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);
    transition:border-color .15s ease, background .15s ease;
  }
  .alttoggle:hover{border-color:var(--accent);}
  .alttoggle .alticon{font-size:1.4rem; flex:none;}
  .alttoggle .altbody{display:flex; flex-direction:column; gap:2px;}
  .alttoggle .alttitle{font-weight:700; font-size:.9rem;}
  .alttoggle .altdesc{font-size:.78rem; color:var(--ink-dim); max-width:64ch;}

  .endlesscard{
    background:linear-gradient(135deg, color-mix(in srgb, var(--accent) 16%, var(--panel)), var(--panel));
    border:1px solid var(--accent); color:var(--ink); padding:20px 24px 16px; margin-bottom:28px;
    clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px);
  }
  .endlesscard-main{
    display:block; width:100%; text-align:left; cursor:pointer; background:none; border:none; color:inherit; padding:0;
    transition:transform .15s ease;
  }
  .endlesscard-main:hover{transform:translateY(-2px);}
  .endlesscard-head{display:flex; gap:14px; align-items:flex-start;}
  .endlesscard-head .emoji{font-size:2rem;}
  .endlesscard-head h3{font-size:1.1rem; margin-bottom:6px;}
  .endlesscard-head .sub{font-size:.85rem; color:var(--ink-dim); max-width:64ch;}
  .endlesscard-stats{display:flex; gap:20px; flex-wrap:wrap; margin-top:14px; font-size:.85rem; color:var(--ink-dim);}
  .endlesscard-stats b{color:var(--accent); font-family:var(--font-mono);}
  .endlesscard-filter{
    margin-top:14px; font-family:var(--font-body); font-size:.8rem; color:var(--accent);
    background:none; border:1px solid var(--accent); padding:6px 14px; cursor:pointer;
    clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);
  }
  .endlesscard-filter:hover{background:color-mix(in srgb, var(--accent) 14%, transparent);}

  .reviewcard{
    display:flex; align-items:center; gap:14px; width:100%; text-align:left; cursor:pointer;
    background:var(--panel); border:1px solid var(--danger); color:var(--ink); padding:16px 20px; margin-bottom:28px;
    clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .reviewcard:hover{transform:translateY(-2px); box-shadow:0 14px 26px -14px var(--shadow);}
  .reviewcard.empty{border-color:var(--line); opacity:.75;}
  .reviewcard .emoji{font-size:1.8rem;}
  .reviewcard h3{font-size:1.05rem; margin-bottom:4px;}
  .reviewcard .sub{font-size:.82rem; color:var(--ink-dim); max-width:56ch;}
  .reviewcard-count{margin-left:auto; font-family:var(--font-mono); font-size:1.1rem; color:var(--danger); flex:none;}
  .reviewcard.empty .reviewcard-count{color:var(--ink-dim);}

  .groupheading{
    font-size:.95rem; color:var(--ink-dim); letter-spacing:.06em; margin:28px 0 12px;
    padding-bottom:6px; border-bottom:1px dashed var(--line);
  }
  .groupheading:first-of-type{margin-top:0;}

  .unitgrid{display:grid; grid-template-columns:repeat(auto-fill, minmax(190px,1fr)); gap:12px;}
  .unitchip{
    display:flex; flex-direction:column; gap:4px; text-align:left; cursor:pointer;
    background:var(--bg-2); color:var(--ink-dim); border:1px solid var(--line); padding:12px 14px;
    clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
    opacity:.55; transition:opacity .15s ease, border-color .15s ease;
  }
  .unitchip.on{opacity:1; border-color:var(--accent); color:var(--ink);}
  .unitchip .uc-emoji{font-size:1.3rem;}
  .unitchip .uc-title{font-size:.85rem; font-weight:600;}
  .unitchip .uc-rate{font-size:.7rem; font-family:var(--font-mono);}

  .recobar{
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;
    background:linear-gradient(135deg, color-mix(in srgb, var(--accent) 14%, var(--panel)), var(--panel));
    border:1px solid var(--accent); padding:14px 18px; margin-bottom:18px;
    clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);
  }
  .recobar .reco-text{font-size:.9rem;}
  .recobar .reco-text b{color:var(--accent);}
  .recobar .reco-sub{display:block; font-size:.75rem; color:var(--ink-dim); margin-top:2px;}
  .diffchiprow{display:flex; gap:10px; flex-wrap:wrap;}
  .diffchip{
    font-family:var(--font-body); font-size:.85rem; cursor:pointer;
    background:var(--bg-2); color:var(--ink-dim); border:1px solid var(--line); padding:8px 16px;
    clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
    opacity:.55; transition:opacity .15s ease, border-color .15s ease;
  }
  .diffchip.on{opacity:1; border-color:var(--accent); color:var(--ink); font-weight:600;}

  .tierchiprow{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:4px;}
  .tierchip{
    display:flex; flex-direction:column; gap:2px; text-align:left; cursor:pointer;
    font-family:var(--font-body); background:var(--bg-2); color:var(--ink-dim);
    border:1px solid var(--line); padding:10px 14px; max-width:220px;
    clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
    opacity:.55; transition:opacity .15s ease, border-color .15s ease;
  }
  .tierchip .tc-label{font-size:.88rem; font-weight:700;}
  .tierchip .tc-count{font-size:.7rem; font-family:var(--font-mono); color:var(--ink-dim);}
  .tierchip .tc-desc{font-size:.72rem; color:var(--ink-dim); line-height:1.4;}
  .tierchip.on{opacity:1;}
  .tierchip.t1.on{border-color:var(--danger); box-shadow:0 0 0 1px var(--danger) inset;}
  .tierchip.t1.on .tc-label{color:var(--danger);}
  .tierchip.t2.on{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset;}
  .tierchip.t2.on .tc-label{color:var(--accent);}
  .tierchip.t3.on{border-color:var(--hero); box-shadow:0 0 0 1px var(--hero) inset;}
  .tierchip.t3.on .tc-label{color:var(--hero);}

  .cramcard{border-color:var(--danger); background:linear-gradient(135deg, color-mix(in srgb, var(--danger) 14%, var(--panel)), var(--panel));}

  .tierbadge{
    display:inline-block; font-family:var(--font-body); font-size:.68rem; font-weight:700;
    letter-spacing:.02em; text-transform:none; padding:2px 8px; margin-left:6px; border-radius:3px; vertical-align:middle;
  }
  .tierbadge.t1{background:color-mix(in srgb, var(--danger) 20%, var(--bg-2)); color:var(--danger); border:1px solid var(--danger);}
  .tierbadge.t2{background:color-mix(in srgb, var(--accent) 18%, var(--bg-2)); color:var(--accent); border:1px solid var(--accent);}
  .tierbadge.t3{background:color-mix(in srgb, var(--hero) 16%, var(--bg-2)); color:var(--hero); border:1px solid var(--hero);}

  .stagegrid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(210px,1fr)); gap:14px; margin-bottom:8px;
  }
  .stagecard{
    position:relative; padding:18px 16px 16px; cursor:pointer; text-align:left;
    background:var(--panel); border:1px solid var(--line); color:var(--ink);
    font-family:var(--font-body); font-size:.95rem;
    clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);
    transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
    display:flex; flex-direction:column; gap:8px;
  }
  .stagecard:hover:not(.locked){transform:translateY(-3px); box-shadow:0 14px 26px -14px var(--shadow); background:var(--panel-2);}
  .stagecard .row1{display:flex; align-items:center; justify-content:space-between;}
  .stagecard .emoji{font-size:1.9rem;}
  .stagecard .idx{font-family:var(--font-mono); font-size:.72rem; color:var(--ink-dim); letter-spacing:.1em;}
  .stagecard h3{font-size:1.05rem; margin-top:2px;}
  .stagecard .sub{font-size:.78rem; color:var(--ink-dim);}
  .stagecard .stars{font-size:.9rem; color:var(--accent); letter-spacing:.08em; margin-top:auto;}
  .stagecard.boss{border-color:var(--danger); box-shadow:0 0 0 1px var(--danger) inset;}
  .stagecard.boss .idx{color:var(--danger); font-weight:700;}
  .stagecard.locked{cursor:not-allowed; opacity:.5; filter:grayscale(.5);}
  .stagecard.locked::after{
    content:"🔒 未解放"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:.8rem; color:var(--ink-dim); background:color-mix(in srgb, var(--bg) 55%, transparent);
  }

  /* ---- shared bars / buttons ---- */
  .battlebar{display:flex; align-items:center; gap:10px; margin-bottom:16px; flex-wrap:wrap;}
  .backbtn{
    font-family:var(--font-body); font-size:.85rem; color:var(--ink-dim); background:none; border:1px solid var(--line);
    padding:6px 12px; cursor:pointer; clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);
  }
  .backbtn:hover{color:var(--ink); border-color:var(--accent);}
  .togglebtn{
    font-family:var(--font-body); font-weight:600; font-size:.85rem; color:var(--accent);
    background:color-mix(in srgb, var(--accent) 10%, var(--panel)); border:1px solid var(--accent);
    padding:6px 14px; cursor:pointer; display:inline-flex; align-items:center; gap:6px;
    clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);
    transition:background .15s ease, color .15s ease;
  }
  .togglebtn:hover{background:var(--accent); color:var(--accent-ink);}

  .endlessbar{
    display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:10px;
    padding:14px 18px; margin-bottom:18px;
  }
  .estat{display:flex; flex-direction:column; gap:2px;}
  .estat .elabel{font-size:.7rem; color:var(--ink-dim); letter-spacing:.08em; text-transform:uppercase;}
  .estat .evalue{font-family:var(--font-mono); font-size:1rem; color:var(--accent); font-weight:700;}

  /* ---- lesson (training ground) screen ---- */
  .lessonintro{padding:22px 26px; margin-bottom:20px;}
  .lessonintro h2{font-size:1.3rem; margin-bottom:6px;}
  .lessonintro p{margin:0; max-width:64ch; color:var(--ink-dim);}
  .lessongrid{display:flex; flex-direction:column; gap:14px; margin-bottom:22px;}
  .lessoncard{padding:18px 20px 20px;}
  .lessoncard .lstep{font-family:var(--font-mono); font-size:.7rem; color:var(--accent); letter-spacing:.12em; text-transform:uppercase; margin-bottom:4px;}
  .lessoncard h3{font-size:1.05rem; margin-bottom:10px;}
  .lessonexplain{margin:12px 0 0; color:var(--ink-dim); font-size:.92rem;}

  /* ---- portal (branching gate) screen ---- */
  .portalgrid{display:grid; grid-template-columns:repeat(auto-fit, minmax(240px,1fr)); gap:16px; margin-bottom:8px;}
  .portalcard{
    text-align:left; background:var(--panel); color:var(--ink); border:1px solid var(--line); cursor:pointer;
    padding:22px 22px 24px; display:flex; flex-direction:column; gap:10px;
    clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);
    transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .portalcard:hover{transform:translateY(-3px); box-shadow:0 14px 26px -14px var(--shadow); background:var(--panel-2);}
  .portalcard .picon{font-size:2rem;}
  .portalcard .ptitle{font-family:var(--font-display); font-size:1.1rem; font-weight:700; display:block;}
  .portalcard .ptitle small{display:block; font-family:var(--font-body); font-weight:400; font-size:.75rem; color:var(--ink-dim); margin-top:2px;}
  .portalcard .pdesc{font-size:.85rem; color:var(--ink-dim); line-height:1.6;}
  .portalcard .pdone{display:block; margin-top:8px; color:var(--hero); font-weight:600; font-size:.8rem;}

  /* ---- study (story-driven lesson) screen ---- */
  .studydots{display:flex; align-items:center; gap:6px; margin-bottom:16px;}
  .studydots .dot{width:8px; height:8px; border-radius:50%; background:var(--bg-2); border:1px solid var(--line);}
  .studydots .dot.done{background:var(--accent); border-color:var(--accent);}
  .studydots .dot.cur{background:var(--accent-ink); border-color:var(--accent); box-shadow:0 0 0 2px var(--accent);}
  .studydots .studystep{margin-left:8px; font-family:var(--font-mono); font-size:.75rem; color:var(--ink-dim);}
  .storycard{padding:24px 26px; margin-bottom:16px;}
  .storycard .sicon{font-size:2.2rem; display:block; margin-bottom:10px;}
  .storycard .sstory{margin:0 0 16px; color:var(--ink); line-height:1.8; max-width:64ch;}
  .storycard .codeblock{margin:0;}
  .quizbox{padding:0;}
  .quizbox .quizq{font-weight:600; margin:0 0 12px;}

  .diffpick{padding:20px 22px;}
  .difftitle{font-weight:600; margin-bottom:12px;}
  .diffpick > .ddesc{font-size:.85rem; color:var(--ink-dim); line-height:1.7;}
  .diffrow{display:grid; grid-template-columns:repeat(auto-fit, minmax(190px,1fr)); gap:12px;}
  .diffbtn{
    text-align:left; background:var(--bg-2); color:var(--ink); border:1px solid var(--line); cursor:pointer;
    padding:14px 16px; display:flex; flex-direction:column; gap:6px;
    clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
    transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .diffbtn:hover{transform:translateY(-2px); background:var(--panel-2); box-shadow:0 10px 20px -12px var(--shadow);}
  .diffbtn .dname{font-weight:700; font-size:1rem;}
  .diffbtn .ddesc{font-size:.78rem; color:var(--ink-dim);}

  .combatants{display:grid; grid-template-columns:1fr auto 1fr; gap:14px; align-items:stretch; margin-bottom:18px;}
  .fighter{padding:16px; display:flex; flex-direction:column; gap:8px;}
  .fighter .who{display:flex; align-items:center; gap:10px;}
  .fighter .who .emoji{font-size:2rem;}
  .fighter .who .name{font-weight:600;}
  .fighter .who .name small{display:block; font-weight:400; font-size:.7rem; color:var(--ink-dim);}
  .hpbar{height:12px; background:var(--bg-2); border:1px solid var(--line); position:relative; overflow:hidden;}
  .hpbar i{
    position:absolute; inset:0; width:100%; display:block; transform-origin:left;
    transition:transform .5s cubic-bezier(.3,.9,.4,1);
  }
  .hpbar.hero i{background:linear-gradient(90deg, color-mix(in srgb, var(--hero) 70%, black 0%), var(--hero));}
  .hpbar.monster i{background:linear-gradient(90deg, var(--danger), color-mix(in srgb, var(--danger) 70%, black 10%));}
  .hpnum{font-family:var(--font-mono); font-size:.78rem; color:var(--ink-dim); display:flex; justify-content:space-between;}
  .vs{align-self:center; font-family:var(--font-display); font-size:1.1rem; color:var(--ink-dim);}

  .qcard{padding:26px 26px 22px; margin-bottom:16px;}
  .qmeta{display:flex; justify-content:space-between; font-family:var(--font-mono); font-size:.72rem; color:var(--ink-dim); letter-spacing:.08em; text-transform:uppercase; margin-bottom:14px;}
  .qlead{font-size:.92rem; color:var(--ink-dim); margin-bottom:10px;}

  .codeblock{
    background:var(--code-bg); color:var(--code-ink); font-family:var(--font-mono); font-size:.92rem;
    padding:16px 18px; margin:0 0 18px; white-space:pre-wrap; word-break:break-word; line-height:1.7;
    border:1px solid var(--line); border-left:3px solid var(--accent);
  }
  .lessoncard .codeblock{margin-bottom:0;}
  .blank{
    color:var(--accent-ink); background:var(--accent); font-weight:700; letter-spacing:.04em;
    padding:0 4px; border-radius:2px;
  }

  .answerrow{display:flex; gap:10px; flex-wrap:wrap;}
  .codeinput{
    flex:1 1 260px; min-width:200px; font-family:var(--font-mono); font-size:.95rem;
    background:var(--bg-2); color:var(--ink); border:1px solid var(--line); padding:12px 14px;
    clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
  }
  .codeinput:disabled{opacity:.7;}
  .codeinput::placeholder{color:var(--ink-dim);}
  .answerrow.long{display:block;}
  .codeinput.long{
    display:block; width:100%; resize:vertical; line-height:1.6; white-space:pre;
  }

  .choicegrid{display:grid; grid-template-columns:repeat(auto-fill, minmax(200px,1fr)); gap:10px;}
  .choicebtn{
    font-family:var(--font-mono); font-size:.9rem; text-align:left;
    background:var(--bg-2); color:var(--ink); border:1px solid var(--line); padding:12px 14px; cursor:pointer;
    clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
    transition:background .15s ease, border-color .15s ease;
  }
  .choicebtn:hover:not(:disabled){background:var(--panel-2); border-color:var(--accent);}
  .choicebtn:disabled{opacity:.6; cursor:default;}

  .codeblock.dragcode{line-height:2;}
  .dragslot{
    display:inline-block; min-width:8em; padding:2px 10px; margin:1px 0; cursor:pointer;
    background:var(--bg-2); border:1px dashed var(--accent); border-radius:3px; color:var(--ink-dim);
    font-style:italic;
  }
  .dragslot.filled{border-style:solid; color:var(--ink); font-style:normal; background:color-mix(in srgb, var(--accent) 12%, var(--bg-2));}
  .dragslot:hover{border-color:var(--danger);}
  .dragtray{display:flex; flex-wrap:wrap; gap:10px; margin-bottom:6px;}
  .dragpiece{
    font-family:var(--font-mono); font-size:.88rem; cursor:grab;
    background:var(--bg-2); color:var(--ink); border:1px solid var(--line); padding:8px 14px;
    clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
    transition:background .15s ease, border-color .15s ease;
  }
  .dragpiece:hover:not(.used){border-color:var(--accent); background:var(--panel-2);}
  .dragpiece.selected{border-color:var(--danger); box-shadow:0 0 0 1px var(--danger) inset;}
  .dragpiece.used{opacity:.35; cursor:default;}

  .feedback{padding:18px 20px; margin-bottom:16px; font-size:.92rem;}
  .feedback .head{font-weight:700; margin-bottom:10px; font-size:1rem;}
  .feedback.good .head{color:var(--hero);}
  .feedback.bad .head{color:var(--danger);}
  .feedback .yourans, .feedback .correctans{margin:0 0 10px; display:flex; gap:8px; align-items:baseline; flex-wrap:wrap;}
  .feedback .label{font-size:.75rem; color:var(--ink-dim); letter-spacing:.06em; text-transform:uppercase; flex:none;}
  .feedback .chip{font-family:var(--font-mono); background:var(--bg-2); border:1px solid var(--line); padding:2px 8px; border-radius:3px;}
  .feedback .explain{margin:12px 0 0; color:var(--ink); border-top:1px dashed var(--line); padding-top:12px;}
  .feedback .explain .tag{display:block; font-size:.72rem; color:var(--accent); letter-spacing:.1em; text-transform:uppercase; margin-bottom:6px;}
  .missedcheck{
    display:flex; align-items:center; gap:8px; margin-top:14px; padding-top:12px;
    border-top:1px dashed var(--line); font-size:.85rem; color:var(--ink-dim); cursor:pointer;
  }
  .missedcheck input{width:16px; height:16px; accent-color:var(--danger); cursor:pointer;}

  .primary{
    font-family:var(--font-body); font-weight:600; font-size:.95rem;
    background:var(--accent); color:var(--accent-ink); border:none; padding:11px 22px; cursor:pointer;
    clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
  }
  .primary:hover:not(:disabled){filter:brightness(1.06);}
  .primary:disabled{opacity:.5; cursor:default;}
  .actionrow{display:flex; justify-content:flex-end; gap:10px; flex-wrap:wrap;}

  .shake{animation:shake .35s ease;}
  @keyframes shake{
    10%,90%{transform:translateX(-1px);} 20%,80%{transform:translateX(2px);}
    30%,50%,70%{transform:translateX(-4px);} 40%,60%{transform:translateX(4px);}
  }
  .pulse{animation:pulse .4s ease;}
  @keyframes pulse{0%{filter:brightness(1);}40%{filter:brightness(1.35);}100%{filter:brightness(1);}}

  /* ---- result screen ---- */
  .result{padding:34px 30px; text-align:center;}
  .result .bigemoji{font-size:3rem; display:block; margin-bottom:6px;}
  .result h2{font-size:1.5rem; margin-bottom:6px;}
  .result .starsline{font-size:1.6rem; color:var(--accent); margin:10px 0 14px; letter-spacing:.1em;}
  .result p{color:var(--ink-dim); max-width:48ch; margin:0 auto 20px;}
  .resultbtns{display:flex; justify-content:center; gap:12px; flex-wrap:wrap;}
  .ghost{
    font-family:var(--font-body); font-size:.9rem; color:var(--ink); background:none;
    border:1px solid var(--line); padding:10px 20px; cursor:pointer;
    clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
  }
  .ghost:hover{border-color:var(--accent);}

  .allclear{padding:30px; text-align:center; margin-top:20px;}
  .footer-note{text-align:center; color:var(--ink-dim); font-size:.78rem; margin-top:30px;}

         explain:'コンピュータのメモリは、1バイトごとに「住所」がついた広大な棚のようなものです。変数を宣言すると、この棚のどこかにその変数専用の場所が確保され、値が保管されます。&(アドレス演算子)を変数の前につけると「その変数が棚の何番地に置かれているか」を調べることができ、これを「アドレス」と呼びます。int* pのように型の後ろに*をつけて宣言した変数は「ポインタ」と呼ばれ、住所(アドレス)だけを保管する専用の箱です。p = &a; と書くとpの中には「aの住所」が入ります。そして*p(間接参照)と書くと、逆に「pに書かれた住所の場所に実際に何が置かれているか」を覗きに行くことができます。&で住所を調べ、*でその住所の中身を見に行く、この2つはペアで使う演算子だと覚えておくと理解しやすくなります。'},
        {title:'参照(別名)', code:'int a = 10;\nint& x = a;  // xはaの別名\nx = 20;\ncout << a << endl; // 20',
         explain:'参照(リファレンス)は、すでにある変数につける「別名(あだ名)」のようなものです。int& x = a; と書くと、xという新しい変数が作られるのではなく、xはaと全く同じメモリ上の場所を指す別名になります。そのためxに値を代入するとaの中身も一緒に変わりますし、逆にaを変えるとxを読んだときの値も変わります。ポインタと似ていますが、参照は宣言と同時に必ず初期化しなければならず(int& x; だけの宣言はエラーになります)、一度ある変数の別名になったら、後で別の変数を指すように変更することもできません。この「一度決めたらずっとそのまま」という性質が、ポインタとの大きな違いです。'},

        {title:'デストラクタ', code:'class ArrayCal{\n  double* array;\npublic:\n  ArrayCal(int n){ array = new double[n]; }\n  ~ArrayCal(){ delete [] array; }\n};',
         explain:'コンストラクタが「オブジェクトが生まれるときに自動で呼ばれる関数」だったのに対し、デストラクタは「オブジェクトが消えるときに自動で呼ばれる関数」です。クラス名の前に~(チルダ)をつけた~ArrayCal()のような名前で定義し、戻り値の型は書きません。この例のように、コンストラクタの中でnewを使って動的にメモリを確保したクラスでは、そのオブジェクトが不要になったときに、確保したメモリを必ずdeleteで解放してあげる必要があります。デストラクタにdelete [] array; と書いておけば、オブジェクトが消えるタイミングでC++が自動的にこの後片付けを実行してくれるので、解放し忘れ(メモリリーク)を防げます。'},
        {title:'new / delete', code:'int* p = new int(5);\n// ...使う...\ndelete p;\nint* arr = new int[10];\ndelete [] arr;',
         explain:'newで確保したメモリは、必ずdeleteで解放しなければいけません。ここで注意が必要なのは、new int(5)のように単体の変数を確保した場合はdelete p;でよいのですが、new int[10]のように配列を確保した場合はdelete [] arr;のように[]をつけて解放する必要があるという点です。この対応(単体はnewとdelete、配列はnew[]とdelete[])を間違えると、正しくメモリが解放されずに不具合の原因になることがあります。そしてそもそもdelete自体を書き忘れると、確保したメモリはプログラムが終了するまでずっと使われたままになる「メモリリーク」という状態になってしまいます。'},
        {title:'vector(可変長配列)', code:'#include <vector>\nvector<int> v;\nv.push_back(1);\nv.push_back(2);',
         explain:'これまで使ってきたint a[5];のような配列は、宣言した時点でサイズが固定されており、後から要素数を増やしたり減らしたりすることはできませんでした。vectorは、この不便さを解消してくれるクラスで、実行中に自由に要素数を増減できる「可変長配列」を扱うことができます。<vector>ヘッダをインクルードし、vector<int> v; のように宣言したあと、v.push_back(1); のようにpush_backメソッドを呼ぶだけで、内部で自動的にメモリの管理をしてくれながら末尾に要素を追加していけます。実は内部ではvectorも動的にメモリを確保・解放していますが、その処理は全部vectorクラスが面倒を見てくれるので、私たちはnewやdeleteを意識する必要がありません。'}

    {id:'wa', title:'系譜の大聖堂', sub:'Week A 継承', emoji:'🧬', mon:'始祖の巨蟲',
      lesson:[
        {title:'継承の基本', code:'class Base{\npublic:\n  int baseFunc(){ return 1; }\n};\nclass Derived : public Base{\npublic:\n  int drvFunc(){ return 2; }\n};',
         explain:'すでにあるクラス(Base)の機能をそのまま引き継いで、新しい機能を追加した別のクラス(Derived)を作ることを「継承」と呼びます。class Derived : public Base{ ... }; という書き方で、DerivedはBaseを継承します。この結果、DerivedのオブジェクトはBaseで定義されているpublicなメンバ関数(baseFuncなど)を、まるで自分自身が最初から持っているメンバであるかのように、そのまま呼び出すことができます。継承元のBaseを「基本クラス(親クラス)」、継承したDerivedを「派生クラス(子クラス)」と呼びます。同じような機能を一から書き直す必要がなくなるので、プログラムの再利用性が大きく高まります。'},
        {title:'イニシャライザで基本クラスを初期化', code:'class Derived : public Base{\n  int drvData;\npublic:\n  Derived(int a,int b):Base(a){ drvData=b; }\n};',
         explain:'派生クラスDerivedのオブジェクトは、内部にBaseから引き継いだ部分(baseDataなど)と、Derived自身が新しく追加した部分(drvData)の両方を持っています。そのためDerivedのコンストラクタは、この両方を初期化してあげる責任があります。Derived(int a,int b):Base(a){ drvData=b; } のように、コンストラクタの本体{ }が始まる前に : Base(a) という「イニシャライザ(初期化子)」を書いておくと、まず基本クラスBaseのコンストラクタが呼ばれてbaseData部分の初期化が行われ、そのあとに{ }の中でdrvDataの初期化が実行される、という順序で処理が進みます。「継承した部分の初期化は、基本クラスのコンストラクタに任せる」というイメージです。'},
        {title:'オーバーライド', code:'class Derived : public Base{\npublic:\n  void show(){ cout << "Derived" << endl; } // Baseのshowを上書き\n};',
         explain:'基本クラスBaseに何かメンバ関数showがすでに定義されていたとして、それと全く同じ名前・同じ引数の関数を派生クラスDerivedの中でもう一度定義することを「オーバーライド」と呼びます。オーバーライドすると、派生クラスのオブジェクト(Derivedのインスタンス)に対してshow()を呼び出したときは、基本クラス側の定義は無視され、派生クラス側で新しく書いた定義が優先して実行されます。「基本クラスが持っていた機能を、派生クラスで自分好みに上書き(オーバーライド)する」というイメージです。名前が同じでも引数の型や数が違う場合は「オーバーライド」ではなく「オーバーロード」という別の仕組みになる点にも注意しましょう。'}
      ],
      qs:[
        {before:'class Base{\npublic:\n  int baseFunc();\n};\nclass Derived : ', after:' Base{\npublic:\n  int drvFunc();\n}; // Baseクラスを継承したい',
         answers:['public'],
         explain:'class Derived : public Base { ... }; と書くことで、DerivedクラスはBaseクラスを継承します。この構文では、クラス名(Derived)の後ろにコロン(:)を書き、続けてアクセス指定子(多くの場合public)を書き、最後に継承したい基本クラス名(Base)を書きます。この1行のおかげで、Derivedは自分では何も書いていなくても、Baseが持っているpublicなメンバ(baseFuncなど)をそのまま自分のもののように呼び出せるようになります。まさに親から子へ財産や才能が受け継がれる「継承(遺産相続)」のようなイメージで捉えると、なぜこの機能がinheritance(継承)と呼ばれるのか納得しやすいでしょう。'},
        {before:'class Derived : public Base{\n  int drvData;\npublic:\n  Derived(int a, int b)', after:'(a){\n    drvData = b;\n  } // 基本クラスのコンストラクタを呼び出す部分(イニシャライザ)',
         answers:[':Base',': Base'],
         explain:'派生クラスDerivedのオブジェクトは、内部に「基本クラスBaseの部分」と「派生クラスDerived自身が追加した部分」の両方を持っています。派生クラスのコンストラクタは、この両方をきちんと初期化する責任がありますが、基本クラスの部分の初期化はBase自身のコンストラクタにやってもらうのが自然です。そのために使うのが「イニシャライザ」と呼ばれる書き方で、コンストラクタの定義(引数リストの後ろ)に : Base(引数) と書いておくと、コンストラクタ本体{ }が実行される前に、まず指定した引数でBaseのコンストラクタが呼び出されます。この仕組みのおかげで、Derivedのコンストラクタでは自分が追加したdrvDataの初期化だけを書けばよくなります。'},
        {before:'class Base{\n', after:':\n  int baseData; // 派生クラスからはアクセスできるが、外部関数からはアクセスできないようにする指定子\npublic:\n  int baseFunc();\n};',
         answers:['protected'],
         explain:'もしbaseDataをprivateにしてしまうと、それを継承したDerivedのメンバ関数からでさえも、baseDataを直接使うことができなくなってしまいます。しかしBaseの外部にある関数(mainなど)からは今まで通りアクセスさせたくない、というときに使うのがprotectedです。protectedにしておくと、Base自身のメンバ関数はもちろん、Baseを継承したDerivedのメンバ関数からも直接アクセスできる一方、それ以外の外部の関数からはprivateと同じようにアクセスできません。「基本クラスと、その子どもである派生クラスの間だけでデータを共有したい」というときに、protectedがちょうど良い公開レベルになります。'},
        {before:'class Derived : public Base{\npublic:\n  void showData(){ cout << "Derived" << endl; }\n};\n// 基本クラスと同名同引数の関数を再定義し、派生クラス側を有効にすることを何と呼ぶか(カタカナで)\n', after:'',

        {before:'// オーバーロードとオーバーライド、この2つの仕組みをまとめて何と呼ぶか(カタカナで)\n', after:'',
         answers:['ポリモーフィズム','多態性'],
         explain:'poly(多い)+ morphe(形)というギリシャ語が語源になっている「ポリモーフィズム(多態性)」とは、1つの名前(関数名)なのに、状況に応じていくつもの異なる形(振る舞い)を取れる性質のことを指します。オーバーロードは「引数の型や数の違いによって、呼び出される中身が変わる」仕組みで、オーバーライドは「オブジェクトの実際のクラス(基本クラスか派生クラスか)によって、同じ名前の関数でも呼び出される中身が変わる」仕組みです。どちらも「同じ名前で呼び出しているのに、状況によって適切な振る舞いが自動的に選ばれる」という点で共通しており、これがポリモーフィズムと呼ばれる理由です。'},
        {before:'// 既存のプログラムを再利用し、機能を拡張しやすくする、クラスの重要な仕組みを漢字二文字で書きなさい\n', after:'',

  /* すべての設問に出典章(unit)と難易度バッチ(diff 1〜4)のタグを付けておく。弱点優先出題・
     単元フィルター・難易度フィルターは、この2つの値だけを頼りに動く。

  var DIFF_BATCH_KEYS = ['qs','qsHard','qsExtra','qsExpert'];
  var DIFF_BATCH_LABEL = {1:'初級(基礎)', 2:'中級(標準)', 3:'上級(応用)', 4:'超級(発展)'};
  var DIFF_WRONG_DMG = {1:14, 2:20, 3:23, 4:28};

  /* 1000本ノックを「重要度」で絞り込むための階層タグ。既存のdiff(難易度)とは別軸で、
     「試験に出る確率が高いか」を表す。個々の設問にq.tierを直接指定すれば手動で上書きでき、
     未指定の設問は難易度バッチから妥当な初期値を自動で割り当てる(基礎・標準→最重要、
     応用→標準、発展→深掘り)。出題実績が増えてきたら、q.tierを個別に調整して精度を上げていける。 */
  var TIER_LABEL = {1:'🔥 最重要', 2:'⭐ 標準', 3:'📚 深掘り'};
  var TIER_DESC = {
    1:'出題確率が高い核心だけ。時間がない直前はここだけ回せば合格ラインに届く。',
    2:'合格を安定させる標準的な設問。最重要が仕上がったらここまで広げよう。',
    3:'完全制覇を狙う人向けのレア・応用設問。時間に余裕があるときに。'
  };
  var DEFAULT_TIER_BY_DIFF = {1:1, 2:1, 3:2, 4:3};
  function questionTier(q){
    return q.tier || DEFAULT_TIER_BY_DIFF[q.diff] || 2;
  }
  BASE_STAGES.forEach(function(st){
    DIFF_BATCH_KEYS.forEach(function(key, i){
      (st[key]||[]).forEach(function(q, qi){ q.unit = st.id; q.diff = i+1; q.qid = st.id+':'+key+':'+qi; });
    });
    (st.qsDrag||[]).forEach(function(q, qi){
      q.unit = st.id; q.diff = 3; q.qid = st.id+':qsDrag:'+qi;
      var blankIds = q.lines.filter(function(ln){ return ln.blank!==undefined; }).map(function(ln){ return ln.blank; });
      q.answers = [blankIds.map(function(b){ return b+'='+q.answerMap[b]; }).join('|')];
    });
  });

  function buildBossStage(group){
    var srcStages = group.ids.map(function(i){ return BASE_STAGES[i]; });
    var lesson = [];
    srcStages.forEach(function(st){
      st.lesson.forEach(function(item){
        lesson.push({title:'『'+st.title+'』'+item.title, code:item.code, explain:item.explain});
      });
    });
    var qs = [];
    srcStages.forEach(function(st){
      var pool = st.qs.slice();
      for(var i=pool.length-1;i>0;i--){
        var j = Math.floor(Math.random()*(i+1));
        var t = pool[i]; pool[i]=pool[j]; pool[j]=t;
      }
      qs = qs.concat(pool.slice(0, 8));
    });
    qs = qs.concat(BOSS_LONG_QS[group.id] || []);
    return {id:group.id, title:group.title, sub:group.sub, emoji:group.emoji, mon:group.mon, isBoss:true, lesson:lesson, qs:qs};
  }

  function recordMissed(qid, correct){

    var s = progress.unitStats[unit];
    var total = s ? s.correct + s.wrong : 0;
    var wrongRate = total > 0 ? s.wrong/total : 0.35;
    return 1 + wrongRate*3; // 1x(誤答無し) 〜 4x(誤答ばかり)
  }

  function unitAttemptInfo(unit){
    var s = progress.unitStats[unit];
    var total = s ? s.correct + s.wrong : 0;
    return {total:total, wrongRate: total>0 ? s.wrong/total : null};
  }

  /* 指定した単元群(省略時は全単元)の正誤実績から、今やるべき難易度バッチ(1〜4)を判定する。
     データが少ない章はまず基礎(1)から、誤答が少なく安定している章ほど高い難易度を勧める。 */
  function recommendDifficulty(unitIds){
    var scope = (unitIds && unitIds.length) ? unitIds : UNIT_LIST.map(function(u){ return u.id; });
    var totalWrong=0, totalCount=0;
    scope.forEach(function(u){
      var s = progress.unitStats[u];
      if(s){ totalWrong += s.wrong; totalCount += s.correct + s.wrong; }
    });
    if(totalCount < 5) return 1;
    var rate = totalWrong/totalCount;
    if(rate > 0.5) return 1;
    if(rate > 0.3) return 2;
    if(rate > 0.15) return 3;
    return 4;
  }

  /* 弱点(誤答率が高い、または未挑戦)な単元だけを抜き出す。おすすめ設定の自動選択に使う。 */
  function weakUnitIds(threshold){
    var th = (typeof threshold === 'number') ? threshold : 0.3;
    var weak = UNIT_LIST.map(function(u){ return u.id; }).filter(function(u){
      var info = unitAttemptInfo(u);
      return info.total===0 || info.wrongRate > th;
    });
    return weak.length ? weak : UNIT_LIST.map(function(u){ return u.id; });
  }

  /* 全問正しく1周する並び順は保ったまま、弱点の章ほど手前に来やすいよう重み付けして並べ替える。
     (指数分布を使った重み付きシャッフルで、重みが大きいほど先頭側に来やすくなる) */
  function weightedShuffle(indices){
    return indices.map(function(i){
      var w = unitWeight(ENDLESS_POOL[i].unit);
      var key = Math.pow(Math.random(), 1/w);
      return {i:i, key:key};
    }).sort(function(a,b){ return b.key - a.key; }).map(function(k){ return k.i; });
  }

  function currentEndlessPoolIndices(){
    var units = progress.settings.endlessUnits;
    var diffs = progress.settings.endlessDiffs;
    var tiers = progress.settings.endlessTiers;
    var base;
    if(!units || units.length===0){
      base = ENDLESS_POOL.map(function(_,i){return i;});
    } else {
      base = [];
      units.forEach(function(u){ base = base.concat(POOL_INDICES_BY_UNIT[u] || []); });
    }
    if(diffs && diffs.length){
      base = base.filter(function(i){ return diffs.indexOf(ENDLESS_POOL[i].diff)!==-1; });
    }
    if(tiers && tiers.length){
      base = base.filter(function(i){ return tiers.indexOf(ENDLESS_POOL[i].tier)!==-1; });
    }
    return base;
  }

  function rebuildEndlessQueue(){
    progress.endless.queue = weightedShuffle(currentEndlessPoolIndices());
    progress.endless.pos = 0;
  }
  function ensureEndlessQueue(){
    var pool = currentEndlessPoolIndices();
    if(progress.endless.queue.length !== pool.length){
      rebuildEndlessQueue();
    }
  }
  function reshuffleEndlessQueue(){
    var lastIdx = progress.endless.queue.length ? progress.endless.queue[progress.endless.queue.length-1] : -1;
    var next = weightedShuffle(currentEndlessPoolIndices());
    if(next.length>1 && next[0]===lastIdx){
      var tmp=next[0]; next[0]=next[1]; next[1]=tmp;
    }
    progress.endless.queue = next;
    progress.endless.pos = 0;
  }

  function shuffle(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var t=a[i]; a[i]=a[j]; a[j]=t;
    }
    return a;
  }

  function esc(s){

  }

  var FULLWIDTH_MAP = {
    '＊':'*','＋':'+','－':'-','＜':'<','＞':'>','／':'/','＆':'&','（':'(','）':')',
    '：':':','；':';','＿':'_','．':'.','，':',','　':' ','％':'%','＝':'=','！':'!',
    '”':'"','“':'"','’':"'",'‘':"'",'〜':'~','～':'~'
  };
  function toHalfWidth(s){
    return String(s).replace(/[Ａ-Ｚａ-ｚ０-９]/g, function(c){
      return String.fromCharCode(c.charCodeAt(0)-0xFEE0);
    }).replace(/[＊＋－＜＞／＆（）：；＿．，　％＝！”“’‘〜～]/g, function(c){
      return FULLWIDTH_MAP[c];
    });
  }
  function normalize(s){
    return toHalfWidth(String(s)).trim().toLowerCase().replace(/\s+/g,'');
  }
  function stripSemi(s){
    return s.replace(/[;。、]+$/,'');
  }
  function stripStd(s){
    return s.replace(/^std::/,'');
  }
  function checkAnswer(input, answers){
    var n = normalize(input);
    var n2 = stripSemi(n);
    var n3 = stripStd(n2);
    return answers.some(function(a){
      var an = normalize(a);
      var an2 = stripSemi(an);
      var an3 = stripStd(an2);
      return n===an || n2===an2 || n3===an3;
    });
  }

  /* その章の全設問(qs/qsHard/qsExtra/qsDrag/qsExpert、ボス戦は集約されたqsのみ)を
     設問自身が持つdiff(1〜4)でグループ化し、各グループの中だけシャッフルしたうえで
     難易度が低い順に連結する。startTier(1〜4)で選んだ難易度から出題が始まり、
     勇者が生き残っている限り、そこから上の難易度へ自動でエスカレートし続ける。 */
  function stageEscalatingPool(st, startTier){
    var all = (st.qs||[]).concat(st.qsHard||[]).concat(st.qsExtra||[]).concat(st.qsDrag||[]).concat(st.qsExpert||[]);
    var byTier = {1:[], 2:[], 3:[], 4:[]};
    all.forEach(function(q){ (byTier[q.diff]||byTier[1]).push(q); });
    var from = startTier || 1;
    return [1,2,3,4].filter(function(lv){ return lv >= from; })
      .reduce(function(acc, lv){ return acc.concat(shuffle(byTier[lv])); }, []);
  }

  function startStage(idx, startTier){

    state.startTier = startTier || 1;

    state.stageIndex=idx;
    state.order = state.activeQs.map(function(_,i){return i;});
    state.qIndex=0;
    state.heroHP=100;
    state.monsterHP=100;
    state.wrong=0;
    state.locked=false;

  /* 「間違いノート」に載っている問題(progress.missed)だけを出題する復習モード。
     正解するとノートから消え、誤答すると残り続けるので、繰り返すほどノートが薄くなる。 */
  function openReview(){
    var qids = Object.keys(progress.missed);
    state.reviewQueue = shuffle(qids.map(function(qid){ return POOL_INDEX_BY_QID[qid]; }).filter(function(i){ return i!==undefined; }));
    state.reviewPos = 0;
    state.reviewStats = {correct:0, wrong:0};
    CUR_Q = null;
    state.locked = false;
    state.screen = 'review';
    render();
  }

  function currentReviewQuestion(){
    var idx = state.reviewQueue[state.reviewPos];
    return ENDLESS_POOL[idx];
  }

  function renderReview(){
    if(state.reviewQueue.length===0){
      return ''+ renderTopbar() +
      '<div class="battlebar"><button class="backbtn" id="btnHome">← 地図へ戻る</button></div>'+
      '<div class="frame result">'+
        '<span class="bigemoji">📗</span><h2>間違いノートは空っぽです</h2>'+
        '<p>今のところ間違えた問題は記録されていません。各章の戦闘や1000本ノックで間違えると、その問題が自動的にここへ集まってきます。</p>'+
        '<div class="resultbtns"><button class="ghost" id="btnMap">地図へ戻る</button></div>'+
      '</div>';
    }
    if(state.reviewPos >= state.reviewQueue.length){
      var remaining = missedCount();
      return ''+ renderTopbar() +
      '<div class="battlebar"><button class="backbtn" id="btnHome">← 地図へ戻る</button></div>'+
      '<div class="frame result">'+
        '<span class="bigemoji">📕</span><h2>この周の復習が終わりました</h2>'+
        '<p>正解 '+state.reviewStats.correct+'問 ／ 誤答 '+state.reviewStats.wrong+'問。間違いノートには、まだ'+remaining+'問残っています。</p>'+
        '<div class="resultbtns">'+
          (remaining>0 ? '<button class="primary" id="btnReviewAgain">もう一度復習する →</button>' : '')+
          '<button class="ghost" id="btnMap">地図へ戻る</button>'+
        '</div>'+
      '</div>';
    }
    if(!CUR_Q){
      var cur = currentReviewQuestion();
      CUR_Q = cur.q;
      state.endlessSrc = cur;
    }
    var qb = renderQuestionBody(CUR_Q);
    return ''+ renderTopbar() +
    '<div class="battlebar"><button class="backbtn" id="btnHome">← 地図へ戻る</button></div>'+
    '<div class="frame endlessbar">'+
      '<div class="estat"><span class="elabel">出題元</span><span class="evalue">'+esc(state.endlessSrc.srcTitle)+'</span></div>'+
      '<div class="estat"><span class="elabel">この周の進捗</span><span class="evalue">'+(state.reviewPos+1)+' / '+state.reviewQueue.length+'</span></div>'+
      '<div class="estat"><span class="elabel">間違いノート残り</span><span class="evalue">'+missedCount()+'問</span></div>'+
    '</div>'+
    '<div class="frame qcard" id="qcard">'+
      '<div class="qmeta"><span>📕 復習モード <span class="tierbadge t'+state.endlessSrc.tier+'">'+esc(TIER_LABEL[state.endlessSrc.tier])+'</span></span><span>'+esc(state.endlessSrc.srcSub)+'</span></div>'+
      '<div class="qlead">'+qb.qlead+'</div>'+
      qb.bodyHtml+
      qb.answerHtml+
    '</div>'+
    '<div id="feedbackSlot"></div>';
  }

  function openUnitPicker(){
    var cur = progress.settings.endlessUnits;
    var curDiff = progress.settings.endlessDiffs;
    var curTier = progress.settings.endlessTiers;
    state.pickerSelection = (cur && cur.length) ? cur.slice() : UNIT_LIST.map(function(u){ return u.id; });
    state.pickerDiffSelection = (curDiff && curDiff.length) ? curDiff.slice() : [1,2,3,4];
    state.pickerTierSelection = (curTier && curTier.length) ? curTier.slice() : [1,2,3];
    state.screen = 'unitPicker';
    render();
  }

      '<p>チェックした単元・難易度・重要度だけを対象に1000本ノックを出題します。誤答率が高い単元には目印がついているので、絞り込みの参考にしよう。何も選ばなければ開始できません。</p>'+
    '</div>'+
    '<div class="frame recobar cramcard">'+
      '<div class="reco-text">⚡ 時間がないなら「最重要」だけに絞って、全単元をひと通り最短で回そう。</div>'+
      '<button class="primary" id="btnPickerCram">⚡ 一夜漬けモード(最重要のみ即開始) →</button>'+
    '</div>'+
    '<div class="frame recobar">'+
      '<div class="reco-text">🤖 選択中の単元でのおすすめ難易度: <b>'+esc(DIFF_BATCH_LABEL[recoLevel])+'</b>'+
        '<span class="reco-sub">(正答実績から自動判定。データが少ない単元はまず初級から勧めます)</span></div>'+

    '<div class="difftitle" style="margin-top:24px;">難易度で絞る(複数選択可)</div>'+
    '<div class="diffchiprow">'+diffChips+'</div>'+
    '<div class="actionrow" style="margin-top:20px;">'+
      '<button class="primary" id="btnPickerStart"'+((sel.length===0||diffSel.length===0||tierSel.length===0)?' disabled':'')+'>この設定で1000本ノックを開始 →</button>'+
    '</div>';
  }

  function currentEndlessQuestion(){
    var idx = progress.endless.queue[progress.endless.pos];
    return ENDLESS_POOL[idx];
  }

  var CUR_Q = null;

  function currentQuestion(){
    var qi = state.order[state.qIndex];
    return state.activeQs[qi];
  }

  var QLEAD_DEFAULT = {
    fill:'空欄(<span style="color:var(--accent);font-weight:700;">______</span>)に入るコードや単語を実際に入力して、呪文のように唱えよう。',
    debug:'🐛 このコードには誤りが1箇所ある。正しく直した内容を入力して唱えよう。',
    choice:'次のうち正しいものを選んで唱えよう。',
    order:'正しい順番になるように、記号をカンマ区切りで入力して唱えよう(例: B,A,C)。',
    dragfill:'🧩 下のピースをドラッグ(またはタップで選んでタップで配置)して、空欄をすべて埋めよう。'
  };

  function renderQuestionBody(q){
    var type = q.type || 'fill';
    var qlead = q.lead ? esc(q.lead) : QLEAD_DEFAULT[type];

    if(type==='dragfill' && state.dragQid !== q.qid){
      state.dragPlacement = {};
      state.dragSelected = null;
      state.dragQid = q.qid;
    }

    var bodyHtml;
    if(type==='order'){
      var linesText = q.lines.map(function(ln){ return ln.label+' : '+ln.code; }).join('\n');
      bodyHtml = '<pre class="codeblock">'+esc(linesText)+'</pre>';
    } else if(type==='choice'){
      bodyHtml = q.code ? '<pre class="codeblock">'+esc(q.code)+'</pre>' : '';
    } else if(type==='dragfill'){
      var placement = state.dragPlacement;
      var codeLines = q.lines.map(function(ln){
        if(ln.blank===undefined) return esc(ln.code);
        var placedId = placement[ln.blank];
        var piece = placedId ? q.pieces.filter(function(p){ return p.id===placedId; })[0] : null;
        return '<span class="dragslot'+(piece?' filled':'')+'" data-blank="'+ln.blank+'">'+(piece?esc(piece.code):'ここにピースを置く')+'</span>';
      });
      bodyHtml = '<pre class="codeblock dragcode">'+codeLines.join('\n')+'</pre>';
    } else {
      bodyHtml = '<pre class="codeblock">'+esc(q.before)+'<mark class="blank">______</mark>'+esc(q.after)+'</pre>';
    }

    var answerHtml;
    if(type==='choice'){
      answerHtml = '<div class="choicegrid" id="choiceGrid">'+
        q.options.map(function(opt,i){
          return '<button class="choicebtn" data-opt="'+i+'">'+esc(opt)+'</button>';
        }).join('')+
      '</div>';
    } else if(type==='dragfill'){
      var usedIds = Object.keys(state.dragPlacement).map(function(b){ return state.dragPlacement[b]; }).filter(Boolean);
      var trayHtml = q.pieces.map(function(p){
        var used = usedIds.indexOf(p.id)!==-1;
        var selected = state.dragSelected===p.id;
        return '<button class="dragpiece'+(used?' used':'')+(selected?' selected':'')+'" data-piece="'+p.id+'" draggable="'+(used?'false':'true')+'"'+(used?' disabled':'')+'>'+esc(p.code)+'</button>';
      }).join('');
      var blankIds = q.lines.filter(function(ln){ return ln.blank!==undefined; }).map(function(ln){ return ln.blank; });
      var allFilled = blankIds.every(function(b){ return !!state.dragPlacement[b]; });
      answerHtml = '<div class="dragtray" id="dragTray">'+trayHtml+'</div>'+
        '<div class="actionrow">'+
          '<button class="ghost" id="btnDragReset" type="button">やり直す</button>'+
          '<button class="primary" id="btnSubmit"'+(allFilled?'':' disabled')+'>詠唱する →</button>'+
        '</div>';
    } else if(q.long){
      answerHtml = '<div class="answerrow long">'+
        '<textarea class="codeinput long" id="ansInput" rows="6" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="ここに複数行のコードを入力…(Enterで改行できます)"></textarea>'+
      '</div>'+
      '<div class="actionrow"><button class="primary" id="btnSubmit">詠唱する →</button></div>';
    } else {
      answerHtml = '<div class="answerrow">'+
        '<input class="codeinput" id="ansInput" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="ここにコードを入力…">'+
        '<button class="primary" id="btnSubmit">詠唱する →</button>'+
      '</div>';
    }
    return {qlead:qlead, bodyHtml:bodyHtml, answerHtml:answerHtml};
  }

  function renderBattle(){
    var st = STAGES[state.stageIndex];
    if(!CUR_Q) CUR_Q = currentQuestion();
    var total = state.activeQs.length;
    var qb = renderQuestionBody(CUR_Q);

    return ''+ renderTopbar() +
    '<div class="battlebar">'+
      '<button class="backbtn" id="btnHome">← 地図へ戻る</button>'+
      '<button class="backbtn" id="btnReview">📖 訓練場で例題を見直す</button>'+
    '</div>'+
    '<div class="combatants">'+
      '<div class="frame fighter"><div class="who"><span class="emoji">🧙</span><div class="name">受験の勇者<small>あなた</small></div></div>'+
        '<div class="hpbar hero"><i style="transform:scaleX('+(state.heroHP/100)+')"></i></div>'+
        '<div class="hpnum"><span>HP</span><span class="num">'+state.heroHP+' / 100</span></div></div>'+
      '<div class="vs">VS</div>'+
      '<div class="frame fighter"><div class="who"><span class="emoji">'+st.emoji+'</span><div class="name">'+esc(st.mon)+'<small>'+esc(st.sub)+'</small></div></div>'+
        '<div class="hpbar monster"><i style="transform:scaleX('+(state.monsterHP/100)+')"></i></div>'+
        '<div class="hpnum"><span>HP</span><span class="num">'+state.monsterHP+' / 100</span></div></div>'+
    '</div>'+
    '<div class="frame qcard" id="qcard">'+
      '<div class="qmeta"><span>設問 '+(state.qIndex+1)+' / '+total+' <span class="tierbadge t'+questionTier(CUR_Q)+'">'+esc(TIER_LABEL[questionTier(CUR_Q)])+'</span></span><span>'+esc(st.title)+' ・ 今: '+esc(DIFF_BATCH_LABEL[CUR_Q.diff]||'')+'</span></div>'+
      '<div class="qlead">'+qb.qlead+'</div>'+
      qb.bodyHtml+
      qb.answerHtml+
    '</div>'+
    '<div id="feedbackSlot"></div>';
  }

  function renderEndless(){
    if(!CUR_Q){
      var cur = currentEndlessQuestion();
      CUR_Q = cur.q;
      state.endlessSrc = cur;
    }
    var qb = renderQuestionBody(CUR_Q);
    var e = progress.endless;
    var total = e.correct + e.wrong;
    var acc = total>0 ? Math.round(e.correct/total*100) : 0;

    var selUnits = progress.settings.endlessUnits;
    var filterNote = (selUnits && selUnits.length) ? '('+selUnits.length+'/'+UNIT_LIST.length+'単元に絞り込み中)' : '(全単元)';

    return ''+ renderTopbar() +
    '<div class="battlebar">'+
      '<button class="backbtn" id="btnHome">← 地図へ戻る</button>'+
      '<button class="backbtn" id="btnEndlessFilter">🎯 単元を絞る '+esc(filterNote)+'</button>'+
    '</div>'+
    '<div class="frame endlessbar">'+
      '<div class="estat"><span class="elabel">出題元</span><span class="evalue">'+esc(state.endlessSrc.srcTitle)+'</span></div>'+
      '<div class="estat"><span class="elabel">連続正解</span><span class="evalue">'+e.streak+'(最高'+e.bestStreak+')</span></div>'+
      '<div class="estat"><span class="elabel">通算正答率</span><span class="evalue">'+e.correct+' / '+total+'('+acc+'%)</span></div>'+
      '<div class="estat"><span class="elabel">今周の残数</span><span class="evalue">'+(progress.endless.queue.length - progress.endless.pos)+' / '+progress.endless.queue.length+'</span></div>'+
    '</div>'+
    '<div class="frame qcard" id="qcard">'+
      '<div class="qmeta"><span>1000本ノック <span class="tierbadge t'+state.endlessSrc.tier+'">'+esc(TIER_LABEL[state.endlessSrc.tier])+'</span></span><span>'+esc(state.endlessSrc.srcSub)+'</span></div>'+
      '<div class="qlead">'+qb.qlead+'</div>'+
      qb.bodyHtml+
      qb.answerHtml+
    '</div>'+
    '<div id="feedbackSlot"></div>';
  }

  function renderResult(win){
    var st = STAGES[state.stageIndex];
    var stars = 1;
    if(win){
      var ratio = state.heroHP/100;
      if(state.wrong===0) stars=3;
      else if(ratio>=0.5) stars=2;
      else stars=1;
      var prev = progress.stars[st.id]||0;
      if(stars>prev) progress.stars[st.id]=stars;
      if(state.stageIndex+2 > progress.unlocked) progress.unlocked = state.stageIndex+2;
      if(progress.unlocked > STAGES.length) progress.unlocked = STAGES.length;
      saveProgress(progress);
    }
    var failMsg = state.failReason==='outofq'
      ? ('<span class="bigemoji">🌀</span><h2>とどめを刺しきれなかった…</h2><p>設問はすべて解き終えたが、'+esc(st.mon)+'にはまだ息がある。誤答が多いと決定打が足りない。訓練場で復習してもう一度挑もう。</p>')
      : ('<span class="bigemoji">💤</span><h2>力尽きた…</h2><p>'+esc(st.mon)+'にHPを削り切られてしまった。訓練場で復習してもう一度挑もう。</p>');
    var body = win ?
      ('<span class="bigemoji">🏆</span><h2>'+esc(st.mon)+'を撃破した！</h2><div class="starsline">'+starString(stars)+'</div><p>誤答'+state.wrong+'回で切り抜けた。単元「'+esc(st.sub)+'」はもう怖くない。</p>')
      : failMsg;

    var nextIdx = state.stageIndex+1;
    var hasNext = win && nextIdx < STAGES.length;

    return ''+ renderTopbar() +
    '<div class="frame result">'+
      body+
      '<div class="resultbtns">'+
        '<button class="ghost" id="btnReview">📖 訓練場で見直す</button>'+
        '<button class="ghost" id="btnRetry">'+(win?'もう一度挑む':'再挑戦する')+'</button>'+
        (hasNext? '<button class="primary" id="btnNext">次の間へ進む →</button>' : '')+
        '<button class="ghost" id="btnMap">地図へ戻る</button>'+
      '</div>'+
    '</div>'+
    (!hasNext && win && nextIdx>=STAGES.length ? '<div class="frame allclear"><h2>🎉 全'+STAGES.length+'章 制覇！</h2><p>期末試験の範囲をひと通り旅した。総獲得星 <span class="num">'+totalStarsEarned()+' / '+TOTAL_STARS+'</span>。仕上げにもう一周して星を集めよう。</p></div>' : '');
  }

  function wireQuestionControls(app){
    var type = CUR_Q.type||'fill';
    if(type==='choice'){
      Array.prototype.forEach.call(app.querySelectorAll('.choicebtn'), function(btn){
        btn.addEventListener('click', function(){ onChoice(parseInt(btn.getAttribute('data-opt'),10)); });
      });
    } else if(type==='dragfill'){
      wireDragfillControls(app);
    } else {
      var input = document.getElementById('ansInput');
      var submitBtn = document.getElementById('btnSubmit');
      submitBtn.addEventListener('click', onSubmit);
      if(input.tagName !== 'TEXTAREA'){
        input.addEventListener('keydown', function(e){
          if(e.key==='Enter'){ e.preventDefault(); onSubmit(); }
        });
      }
      input.focus();
    }
  }

  /* dragfill(複数行空欄をピースで埋める形式)の操作。
     ピースをタップ→空欄をタップで配置(タッチ・キーボード操作でも完結)でき、
     さらにデスクトップではdraggable属性によるネイティブのドラッグ&ドロップにも対応する。 */
  function dragfillValue(q){
    var blankIds = q.lines.filter(function(ln){ return ln.blank!==undefined; }).map(function(ln){ return ln.blank; });
    return blankIds.map(function(b){ return b+'='+(state.dragPlacement[b]||''); }).join('|');
  }

  function wireDragfillControls(app){
    Array.prototype.forEach.call(app.querySelectorAll('.dragpiece:not(.used)'), function(btn){
      btn.addEventListener('click', function(){
        if(state.locked) return;
        var pid = btn.getAttribute('data-piece');
        state.dragSelected = (state.dragSelected===pid) ? null : pid;
        render();
      });
      btn.addEventListener('dragstart', function(e){
        if(e.dataTransfer) e.dataTransfer.setData('text/plain', btn.getAttribute('data-piece'));
      });
    });
    Array.prototype.forEach.call(app.querySelectorAll('.dragslot'), function(slot){
      slot.addEventListener('click', function(){
        if(state.locked) return;
        var blankId = slot.getAttribute('data-blank');
        if(slot.classList.contains('filled')){
          state.dragPlacement[blankId] = null;
        } else if(state.dragSelected){
          state.dragPlacement[blankId] = state.dragSelected;
          state.dragSelected = null;
        }
        render();
      });
      slot.addEventListener('dragover', function(e){ e.preventDefault(); });
      slot.addEventListener('drop', function(e){
        e.preventDefault();
        if(state.locked) return;
        var pid = e.dataTransfer ? e.dataTransfer.getData('text/plain') : null;
        if(pid){
          state.dragPlacement[slot.getAttribute('data-blank')] = pid;
          state.dragSelected = null;
          render();
        }
      });
    });
    var resetBtn = document.getElementById('btnDragReset');
    if(resetBtn) resetBtn.addEventListener('click', function(){
      if(state.locked) return;
      state.dragPlacement = {};
      state.dragSelected = null;
      render();
    });
    var submitBtn = document.getElementById('btnSubmit');
    if(submitBtn) submitBtn.addEventListener('click', function(){
      if(state.locked || submitBtn.disabled) return;
      resolveAnswer(dragfillValue(CUR_Q));
    });
  }

  function render(){
    var app = document.getElementById('app');
    if(state.screen==='map'){
      app.innerHTML = renderMap();
      Array.prototype.forEach.call(app.querySelectorAll('.stagecard:not(.locked)'), function(btn){
        btn.addEventListener('click', function(){
          CUR_Q = null;
          var idx = parseInt(btn.getAttribute('data-idx'),10);
          var st = STAGES[idx];
          if(st.studyBeats && st.studyBeats.length) openPortal(idx);
          else openLesson(idx, false);
        });
      });
      document.getElementById('btnEndless').addEventListener('click', function(){
        openEndless();
      });
      document.getElementById('btnAltToggle').addEventListener('click', function(){
        progress.settings.allowAlt = !progress.settings.allowAlt;
        saveProgress(progress);
        render();
      });
      document.getElementById('btnUnitPicker').addEventListener('click', function(){
        openUnitPicker();
      });
      document.getElementById('btnReview2').addEventListener('click', function(){
        openReview();
      });
    } else if(state.screen==='unitPicker'){
      app.innerHTML = renderUnitPicker();
      document.getElementById('btnPickerBack').addEventListener('click', function(){
        state.screen = 'map';
        render();
      });
      Array.prototype.forEach.call(app.querySelectorAll('.unitchip'), function(btn){
        btn.addEventListener('click', function(){
          var id = btn.getAttribute('data-unit');
          var idx = state.pickerSelection.indexOf(id);
          if(idx===-1) state.pickerSelection.push(id);
          else state.pickerSelection.splice(idx,1);
          render();
        });
      });
      document.getElementById('btnPickerAll').addEventListener('click', function(){
        state.pickerSelection = UNIT_LIST.map(function(u){ return u.id; });
        render();
      });
      document.getElementById('btnPickerNone').addEventListener('click', function(){
        state.pickerSelection = [];
        render();
      });
      Array.prototype.forEach.call(app.querySelectorAll('.diffchip'), function(btn){
        btn.addEventListener('click', function(){
          var lv = parseInt(btn.getAttribute('data-diff'),10);
          var idx = state.pickerDiffSelection.indexOf(lv);
          if(idx===-1) state.pickerDiffSelection.push(lv);
          else state.pickerDiffSelection.splice(idx,1);
          render();
        });
      });
      Array.prototype.forEach.call(app.querySelectorAll('.tierchip'), function(btn){
        btn.addEventListener('click', function(){
          var lv = parseInt(btn.getAttribute('data-tier'),10);
          var idx = state.pickerTierSelection.indexOf(lv);
          if(idx===-1) state.pickerTierSelection.push(lv);
          else state.pickerTierSelection.splice(idx,1);
          render();
        });
      });
      document.getElementById('btnPickerAuto').addEventListener('click', function(){
        var weak = weakUnitIds();
        state.pickerSelection = weak.slice();
        state.pickerDiffSelection = [recommendDifficulty(weak)];
        render();
      });
      document.getElementById('btnPickerCram').addEventListener('click', function(){
        state.pickerSelection = UNIT_LIST.map(function(u){ return u.id; });
        state.pickerDiffSelection = [1,2,3,4];
        state.pickerTierSelection = [1];
        progress.settings.endlessUnits = null;
        progress.settings.endlessDiffs = null;
        progress.settings.endlessTiers = [1];
        saveProgress(progress);
        rebuildEndlessQueue();
        CUR_Q = null;
        state.screen = 'endless';
        render();
      });
      document.getElementById('btnPickerStart').addEventListener('click', function(){
        if(state.pickerSelection.length===0 || state.pickerDiffSelection.length===0 || state.pickerTierSelection.length===0) return;
        progress.settings.endlessUnits = (state.pickerSelection.length===UNIT_LIST.length)
          ? null : state.pickerSelection.slice();
        progress.settings.endlessDiffs = (state.pickerDiffSelection.length===4)
          ? null : state.pickerDiffSelection.slice();
        progress.settings.endlessTiers = (state.pickerTierSelection.length===3)
          ? null : state.pickerTierSelection.slice();
        saveProgress(progress);
        rebuildEndlessQueue();
        CUR_Q = null;
        state.screen = 'endless';
        render();
      });
    } else if(state.screen==='portal'){
      app.innerHTML = renderPortal();
      document.getElementById('btnPortalBack').addEventListener('click', function(){
        state.screen = 'map';
        render();
      });
      document.getElementById('btnGoStudy').addEventListener('click', function(){
        startStudy(state.stageIndex);
      });
      document.getElementById('btnGoChallenge').addEventListener('click', function(){
        openLesson(state.stageIndex, false);
      });
    } else if(state.screen==='study'){
      app.innerHTML = renderStudy();
      var studyBack = document.getElementById('btnStudyBack');
      if(studyBack) studyBack.addEventListener('click', function(){ openPortal(state.stageIndex); });
      var studyToggle = document.getElementById('btnStudyToggle');
      if(studyToggle) studyToggle.addEventListener('click', function(){ openLesson(state.stageIndex, false); });
      var studyNext = document.getElementById('btnStudyNext');
      if(studyNext) studyNext.addEventListener('click', function(){
        state.studyStep++; state.studyPicked = null; render();
      });
      var studyToChallenge = document.getElementById('btnStudyToChallenge');
      if(studyToChallenge) studyToChallenge.addEventListener('click', function(){ openLesson(state.stageIndex, false); });
      var studyToPortal = document.getElementById('btnStudyToPortal');
      if(studyToPortal) studyToPortal.addEventListener('click', function(){ openPortal(state.stageIndex); });
      Array.prototype.forEach.call(app.querySelectorAll('.studyquizbtn'), function(btn){
        btn.addEventListener('click', function(){
          state.studyPicked = parseInt(btn.getAttribute('data-opt'),10);
          render();
        });
      });
    } else if(state.screen==='lesson'){
      app.innerHTML = renderLesson();
      document.getElementById('btnLessonBack').addEventListener('click', function(){
        var st = STAGES[state.stageIndex];
        var hasPortal = !!(st.studyBeats && st.studyBeats.length);
        state.screen = state.lessonFromBattle ? 'battle' : (hasPortal ? 'portal' : 'map');
        render();
      });
      var lessonToggle = document.getElementById('btnLessonToggleStudy');
      if(lessonToggle) lessonToggle.addEventListener('click', function(){
        /* studyStep/studyPickedはリセットしない。前回学習パートを離れた地点から
           そのまま再開できるよう、画面だけを切り替える即時トグル。 */
        state.screen = 'study';
        render();
      });
      var toBattleBtn = document.getElementById('btnToBattle');
      if(toBattleBtn){
        toBattleBtn.addEventListener('click', function(){ state.screen='battle'; render(); });
      }
      Array.prototype.forEach.call(app.querySelectorAll('.diffbtn'), function(btn){
        btn.addEventListener('click', function(){
          startStage(state.stageIndex, parseInt(btn.getAttribute('data-tier'),10));
        });
      });
    } else if(state.screen==='battle'){
      app.innerHTML = renderBattle();
      document.getElementById('btnHome').addEventListener('click', function(){
        CUR_Q=null; state.screen='map'; render();
      });
      document.getElementById('btnReview').addEventListener('click', function(){
        openLesson(state.stageIndex, true);
      });
      wireQuestionControls(app);
    } else if(state.screen==='endless'){
      app.innerHTML = renderEndless();
      document.getElementById('btnHome').addEventListener('click', function(){
        CUR_Q=null; state.screen='map'; render();
      });
      document.getElementById('btnEndlessFilter').addEventListener('click', function(){
        CUR_Q=null; openUnitPicker();
      });
      wireQuestionControls(app);
    } else if(state.screen==='review'){
      app.innerHTML = renderReview();
      var reviewHome = document.getElementById('btnHome');
      if(reviewHome) reviewHome.addEventListener('click', function(){ CUR_Q=null; state.screen='map'; render(); });
      var reviewMap = document.getElementById('btnMap');
      if(reviewMap) reviewMap.addEventListener('click', function(){ CUR_Q=null; state.screen='map'; render(); });
      var reviewAgain = document.getElementById('btnReviewAgain');
      if(reviewAgain) reviewAgain.addEventListener('click', function(){ openReview(); });
      if(document.getElementById('qcard')) wireQuestionControls(app);
    } else if(state.screen==='result-win' || state.screen==='result-lose'){
      var win = state.screen==='result-win';
      app.innerHTML = renderResult(win);
      var review = document.getElementById('btnReview');
      if(review) review.addEventListener('click', function(){ CUR_Q=null; openLesson(state.stageIndex, false); });
      var retry = document.getElementById('btnRetry');
      if(retry) retry.addEventListener('click', function(){ CUR_Q=null; startStage(state.stageIndex, state.startTier); });
      var next = document.getElementById('btnNext');
      if(next) next.addEventListener('click', function(){ CUR_Q=null; startStage(state.stageIndex+1, state.startTier); });
      var map = document.getElementById('btnMap');
      if(map) map.addEventListener('click', function(){ CUR_Q=null; state.screen='map'; render(); });
    }
  }

  function onSubmit(){
    if(state.locked) return;
    var input = document.getElementById('ansInput');
    var val = input.value;
    if(!val.trim()){
      input.classList.add('shake');
      setTimeout(function(){ input.classList.remove('shake'); }, 350);
      input.focus();
      return;
    }
    input.disabled = true;
    document.getElementById('btnSubmit').disabled = true;
    resolveAnswer(val);
  }

  function onChoice(idx){
    if(state.locked) return;
    Array.prototype.forEach.call(document.querySelectorAll('.choicebtn'), function(b){ b.disabled = true; });
    resolveAnswer(CUR_Q.options[idx]);
  }

  function resolveAnswer(val){
    state.locked = true;

    var isEndless = state.screen==='endless';
    var isReview = state.screen==='review';
    var answerPool = (progress.settings.allowAlt && CUR_Q.altAnswers && CUR_Q.altAnswers.length)
      ? CUR_Q.answers.concat(CUR_Q.altAnswers) : CUR_Q.answers;
    var correct = checkAnswer(val, answerPool);
    var slot = document.getElementById('feedbackSlot');
    var qcard = document.getElementById('qcard');

    recordUnitAnswer(CUR_Q.unit, correct);
    recordMissed(CUR_Q.qid, correct);

    if(isEndless){
      if(correct){
        progress.endless.correct++;
        progress.endless.streak++;
        if(progress.endless.streak > progress.endless.bestStreak) progress.endless.bestStreak = progress.endless.streak;
        qcard.classList.add('pulse');
      } else {
        progress.endless.wrong++;
        progress.endless.streak = 0;
        qcard.classList.add('shake');
      }
      saveProgress(progress);
    } else if(isReview){
      if(correct){
        state.reviewStats.correct++;
        qcard.classList.add('pulse');
      } else {
        state.reviewStats.wrong++;
        qcard.classList.add('shake');
      }
      saveProgress(progress);
    } else {
      var dmgToMonster = Math.ceil(100/state.activeQs.length);
      var wrongDmg = DIFF_WRONG_DMG[CUR_Q.diff] || 20;
      if(correct){
        state.monsterHP = Math.max(0, state.monsterHP - dmgToMonster);
        qcard.classList.add('pulse');
      } else {
        state.wrong++;
        state.heroHP = Math.max(0, state.heroHP - wrongDmg);
        qcard.classList.add('shake');
      }
      saveProgress(progress);
    }

    var yourAnsChip, correctAnsChip;
    if(CUR_Q.type==='dragfill'){
      var dfBlankIds = CUR_Q.lines.filter(function(ln){ return ln.blank!==undefined; }).map(function(ln){ return ln.blank; });
      var pieceCode = function(pid){
        var p = CUR_Q.pieces.filter(function(pp){ return pp.id===pid; })[0];
        return p ? p.code : '(空欄)';
      };
      yourAnsChip = '<div class="yourans"><span class="label">あなたの配置</span>'+
        dfBlankIds.map(function(b){ return '<span class="chip">'+esc(pieceCode(state.dragPlacement[b]))+'</span>'; }).join('')+
      '</div>';
      correctAnsChip = correct ? '' : '<div class="correctans"><span class="label">正解</span>'+
        dfBlankIds.map(function(b){ return '<span class="chip">'+esc(pieceCode(CUR_Q.answerMap[b]))+'</span>'; }).join('')+
      '</div>';
    } else {
      yourAnsChip = '<div class="yourans"><span class="label">あなたの回答</span><span class="chip">'+esc(val)+'</span></div>';
      correctAnsChip = correct ? '' : '<div class="correctans"><span class="label">正解例</span><span class="chip">'+esc(CUR_Q.answers.join(' / '))+'</span></div>';
    }

    var missedNow = !!progress.missed[CUR_Q.qid];
    slot.innerHTML = ''+
      '<div class="frame feedback '+(correct?'good':'bad')+'">'+
        '<div class="head">'+(correct? '⚔️ 会心の一撃！' : '💥 手痛い反撃を受けた…')+'</div>'+
        yourAnsChip+
        correctAnsChip+
        '<div class="explain"><span class="tag">解説</span>'+esc(CUR_Q.explain)+'</div>'+
        '<label class="missedcheck"><input type="checkbox" id="missedToggle"'+(missedNow?' checked':'')+'> 📕 この問題を復習ノートに入れる</label>'+
      '</div>'+
      '<div class="actionrow"><button class="primary" id="btnContinue">つづける →</button></div>';

    if(!isEndless && !isReview) setTimeout(refreshBars, 30);

    document.getElementById('missedToggle').addEventListener('change', function(e){
      if(e.target.checked) progress.missed[CUR_Q.qid] = true;
      else delete progress.missed[CUR_Q.qid];
      saveProgress(progress);
    });

    document.getElementById('btnContinue').addEventListener('click', function(){
      CUR_Q = null;
      if(isEndless){
        progress.endless.pos++;
        if(progress.endless.pos >= progress.endless.queue.length){
          reshuffleEndlessQueue();
        }
        saveProgress(progress);
        state.locked = false;
        render();
        return;
      }
      if(isReview){
        state.reviewPos++;
        state.locked = false;
        render();
        return;
      }
      if(state.heroHP<=0){ state.failReason='hero'; state.screen='result-lose'; render(); return; }
      if(state.monsterHP<=0){ state.screen='result-win'; render(); return; }
      state.qIndex++;
      if(state.qIndex >= state.order.length){
        if(state.monsterHP<=0){ state.screen='result-win'; }
        else { state.failReason='outofq'; state.screen='result-lose'; }
        render();
        return;
      }
      state.locked = false;
      render();
    });
  }

  function refreshBars(){
    var heroBar = document.querySelector('.hpbar.hero i');
    var monBar = document.querySelector('.hpbar.monster i');
    if(heroBar) heroBar.style.transform = 'scaleX('+(state.heroHP/100)+')';
    if(monBar) monBar.style.transform = 'scaleX('+(state.monsterHP/100)+')';
    var nums = document.querySelectorAll('.hpnum .num');
    if(nums[0]) nums[0].textContent = state.heroHP+' / 100';
    if(nums[1]) nums[1].textContent = state.monsterHP+' / 100';
  }

  render();
})();
</script>

</body>
</html>
