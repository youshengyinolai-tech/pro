<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>コード転生記 — 期末試験クエスト</title>
</head>
<body>
<style>
  :root{
    --bg:#f3ead9;
    --bg-2:#ece0c8;
    --panel:#fbf4e4;
    --panel-2:#f1e5c8;
    --ink:#2b2318;
    --ink-dim:#6b5b3e;
    --accent:#a8752c;
    --accent-ink:#fff8ec;
    --hero:#3f7a4a;
    --danger:#a33f2d;
    --line:rgba(168,117,44,0.35);
    --shadow:rgba(43,35,24,0.18);
    --code-bg:#efe3ca;
    --code-ink:#3a2f1d;
    --font-display:"Hiragino Mincho ProN","YuMincho","Yu Mincho",Georgia,serif;
    --font-body:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",system-ui,-apple-system,sans-serif;
    --font-mono:ui-monospace,"SF Mono","Cascadia Code",Consolas,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#171225;
      --bg-2:#1f1830;
      --panel:#241b36;
      --panel-2:#2c2140;
      --ink:#f1e9d8;
      --ink-dim:#cbb99a;
      --accent:#e0a458;
      --accent-ink:#2b1c08;
      --hero:#7fb685;
      --danger:#e2765f;
      --line:rgba(224,164,88,0.35);
      --shadow:rgba(0,0,0,0.45);
      --code-bg:#120f1e;
      --code-ink:#e9e1c9;
    }
  }
  :root[data-theme="dark"]{
    --bg:#171225; --bg-2:#1f1830; --panel:#241b36; --panel-2:#2c2140;
    --ink:#f1e9d8; --ink-dim:#cbb99a; --accent:#e0a458; --accent-ink:#2b1c08;
    --hero:#7fb685; --danger:#e2765f; --line:rgba(224,164,88,0.35); --shadow:rgba(0,0,0,0.45);
    --code-bg:#120f1e; --code-ink:#e9e1c9;
  }
  :root[data-theme="light"]{
    --bg:#f3ead9; --bg-2:#ece0c8; --panel:#fbf4e4; --panel-2:#f1e5c8;
    --ink:#2b2318; --ink-dim:#6b5b3e; --accent:#a8752c; --accent-ink:#fff8ec;
    --hero:#3f7a4a; --danger:#a33f2d; --line:rgba(168,117,44,0.35); --shadow:rgba(43,35,24,0.18);
    --code-bg:#efe3ca; --code-ink:#3a2f1d;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 60%),
      radial-gradient(ellipse 900px 600px at 90% 110%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    line-height:1.6;
    padding:32px 18px 64px;
  }
  h1,h2,h3{font-family:var(--font-display); text-wrap:balance; margin:0;}
  .num{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
  ::selection{background:var(--accent); color:var(--accent-ink);}
  :focus-visible{outline:2px solid var(--accent); outline-offset:3px;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important;}
  }

  .stage{max-width:920px; margin:0 auto;}

  /* ---- top bar ---- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    margin-bottom:26px; flex-wrap:wrap;
  }
  .brand{display:flex; align-items:baseline; gap:10px;}
  .brand .glyph{font-size:1.6rem;}
  .brand h1{font-size:1.5rem; letter-spacing:.02em;}
  .brand small{display:block; font-size:.75rem; color:var(--ink-dim); letter-spacing:.12em; text-transform:uppercase; margin-top:2px;}
  .tally{
    display:flex; align-items:center; gap:10px;
    font-family:var(--font-mono); font-size:.85rem; color:var(--ink-dim);
    background:var(--panel); border:1px solid var(--line); padding:8px 14px;
    clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
  }
  .tally .stars{color:var(--accent); letter-spacing:.05em;}

  /* ---- frame / card base ---- */
  .frame{
    background:var(--panel);
    border:1px solid var(--line);
    box-shadow:0 10px 28px -14px var(--shadow);
    clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px);
  }

  /* ---- map screen ---- */
  .intro{padding:22px 26px; margin-bottom:26px;}
  .intro p{margin:.5em 0 0; max-width:64ch; color:var(--ink-dim);}
  .intro h2{font-size:1.3rem; margin-bottom:4px;}

  .alttoggle{
    display:flex; align-items:center; gap:14px; width:100%; text-align:left; cursor:pointer;
    background:var(--panel); border:1px solid var(--line); color:var(--ink); padding:14px 18px; margin-bottom:16px;
    clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);
    transition:border-color .15s ease, background .15s ease;
  }
  .alttoggle:hover{border-color:var(--accent);}
  .alttoggle .alticon{font-size:1.4rem; flex:none;}
  .alttoggle .altbody{display:flex; flex-direction:column; gap:2px;}
  .alttoggle .alttitle{font-weight:700; font-size:.9rem;}
  .alttoggle .altdesc{font-size:.78rem; color:var(--ink-dim); max-width:64ch;}

  .endlesscard{
    display:block; width:100%; text-align:left; cursor:pointer;
    background:linear-gradient(135deg, color-mix(in srgb, var(--accent) 16%, var(--panel)), var(--panel));
    border:1px solid var(--accent); color:var(--ink); padding:20px 24px; margin-bottom:28px;
    clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .endlesscard:hover{transform:translateY(-2px); box-shadow:0 14px 26px -14px var(--shadow);}
  .endlesscard-head{display:flex; gap:14px; align-items:flex-start;}
  .endlesscard-head .emoji{font-size:2rem;}
  .endlesscard-head h3{font-size:1.1rem; margin-bottom:6px;}
  .endlesscard-head .sub{font-size:.85rem; color:var(--ink-dim); max-width:64ch;}
  .endlesscard-stats{display:flex; gap:20px; flex-wrap:wrap; margin-top:14px; font-size:.85rem; color:var(--ink-dim);}
  .endlesscard-stats b{color:var(--accent); font-family:var(--font-mono);}

  .groupheading{
    font-size:.95rem; color:var(--ink-dim); letter-spacing:.06em; margin:28px 0 12px;
    padding-bottom:6px; border-bottom:1px dashed var(--line);
  }
  .groupheading:first-of-type{margin-top:0;}

  .stagegrid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(210px,1fr)); gap:14px; margin-bottom:8px;
  }
  .stagecard{
    position:relative; padding:18px 16px 16px; cursor:pointer; text-align:left;
    background:var(--panel); border:1px solid var(--line); color:var(--ink);
    font-family:var(--font-body); font-size:.95rem;
    clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);
    transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
    display:flex; flex-direction:column; gap:8px;
  }
  .stagecard:hover:not(.locked){transform:translateY(-3px); box-shadow:0 14px 26px -14px var(--shadow); background:var(--panel-2);}
  .stagecard .row1{display:flex; align-items:center; justify-content:space-between;}
  .stagecard .emoji{font-size:1.9rem;}
  .stagecard .idx{font-family:var(--font-mono); font-size:.72rem; color:var(--ink-dim); letter-spacing:.1em;}
  .stagecard h3{font-size:1.05rem; margin-top:2px;}
  .stagecard .sub{font-size:.78rem; color:var(--ink-dim);}
  .stagecard .stars{font-size:.9rem; color:var(--accent); letter-spacing:.08em; margin-top:auto;}
  .stagecard.boss{border-color:var(--danger); box-shadow:0 0 0 1px var(--danger) inset;}
  .stagecard.boss .idx{color:var(--danger); font-weight:700;}
  .stagecard.locked{cursor:not-allowed; opacity:.5; filter:grayscale(.5);}
  .stagecard.locked::after{
    content:"🔒 未解放"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:.8rem; color:var(--ink-dim); background:color-mix(in srgb, var(--bg) 55%, transparent);
  }

  /* ---- shared bars / buttons ---- */
  .battlebar{display:flex; align-items:center; gap:10px; margin-bottom:16px; flex-wrap:wrap;}
  .backbtn{
    font-family:var(--font-body); font-size:.85rem; color:var(--ink-dim); background:none; border:1px solid var(--line);
    padding:6px 12px; cursor:pointer; clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);
  }
  .backbtn:hover{color:var(--ink); border-color:var(--accent);}

  .endlessbar{
    display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:10px;
    padding:14px 18px; margin-bottom:18px;
  }
  .estat{display:flex; flex-direction:column; gap:2px;}
  .estat .elabel{font-size:.7rem; color:var(--ink-dim); letter-spacing:.08em; text-transform:uppercase;}
  .estat .evalue{font-family:var(--font-mono); font-size:1rem; color:var(--accent); font-weight:700;}

  /* ---- lesson (training ground) screen ---- */
  .lessonintro{padding:22px 26px; margin-bottom:20px;}
  .lessonintro h2{font-size:1.3rem; margin-bottom:6px;}
  .lessonintro p{margin:0; max-width:64ch; color:var(--ink-dim);}
  .lessongrid{display:flex; flex-direction:column; gap:14px; margin-bottom:22px;}
  .lessoncard{padding:18px 20px 20px;}
  .lessoncard .lstep{font-family:var(--font-mono); font-size:.7rem; color:var(--accent); letter-spacing:.12em; text-transform:uppercase; margin-bottom:4px;}
  .lessoncard h3{font-size:1.05rem; margin-bottom:10px;}
  .lessonexplain{margin:12px 0 0; color:var(--ink-dim); font-size:.92rem;}

  .diffpick{padding:20px 22px;}
  .difftitle{font-weight:600; margin-bottom:12px;}
  .diffrow{display:grid; grid-template-columns:repeat(auto-fit, minmax(200px,1fr)); gap:12px;}
  .diffbtn{
    text-align:left; background:var(--bg-2); color:var(--ink); border:1px solid var(--line); cursor:pointer;
    padding:14px 16px; display:flex; flex-direction:column; gap:6px;
    clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
    transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .diffbtn:hover{transform:translateY(-2px); background:var(--panel-2); box-shadow:0 10px 20px -12px var(--shadow);}
  .diffbtn .dname{font-weight:700; font-size:1rem;}
  .diffbtn .ddesc{font-size:.78rem; color:var(--ink-dim);}
  .diffbtn-off .ddesc{color:var(--ink-dim); font-style:italic;}

  .combatants{display:grid; grid-template-columns:1fr auto 1fr; gap:14px; align-items:stretch; margin-bottom:18px;}
  .fighter{padding:16px; display:flex; flex-direction:column; gap:8px;}
  .fighter .who{display:flex; align-items:center; gap:10px;}
  .fighter .who .emoji{font-size:2rem;}
  .fighter .who .name{font-weight:600;}
  .fighter .who .name small{display:block; font-weight:400; font-size:.7rem; color:var(--ink-dim);}
  .hpbar{height:12px; background:var(--bg-2); border:1px solid var(--line); position:relative; overflow:hidden;}
  .hpbar i{
    position:absolute; inset:0; width:100%; display:block; transform-origin:left;
    transition:transform .5s cubic-bezier(.3,.9,.4,1);
  }
  .hpbar.hero i{background:linear-gradient(90deg, color-mix(in srgb, var(--hero) 70%, black 0%), var(--hero));}
  .hpbar.monster i{background:linear-gradient(90deg, var(--danger), color-mix(in srgb, var(--danger) 70%, black 10%));}
  .hpnum{font-family:var(--font-mono); font-size:.78rem; color:var(--ink-dim); display:flex; justify-content:space-between;}
  .vs{align-self:center; font-family:var(--font-display); font-size:1.1rem; color:var(--ink-dim);}

  .qcard{padding:26px 26px 22px; margin-bottom:16px;}
  .qmeta{display:flex; justify-content:space-between; font-family:var(--font-mono); font-size:.72rem; color:var(--ink-dim); letter-spacing:.08em; text-transform:uppercase; margin-bottom:14px;}
  .qlead{font-size:.92rem; color:var(--ink-dim); margin-bottom:10px;}

  .codeblock{
    background:var(--code-bg); color:var(--code-ink); font-family:var(--font-mono); font-size:.92rem;
    padding:16px 18px; margin:0 0 18px; white-space:pre-wrap; word-break:break-word; line-height:1.7;
    border:1px solid var(--line); border-left:3px solid var(--accent);
  }
  .lessoncard .codeblock{margin-bottom:0;}
  .blank{
    color:var(--accent-ink); background:var(--accent); font-weight:700; letter-spacing:.04em;
    padding:0 4px; border-radius:2px;
  }

  .answerrow{display:flex; gap:10px; flex-wrap:wrap;}
  .codeinput{
    flex:1 1 260px; min-width:200px; font-family:var(--font-mono); font-size:.95rem;
    background:var(--bg-2); color:var(--ink); border:1px solid var(--line); padding:12px 14px;
    clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
  }
  .codeinput:disabled{opacity:.7;}
  .codeinput::placeholder{color:var(--ink-dim);}
  .answerrow.long{display:block;}
  .codeinput.long{
    display:block; width:100%; resize:vertical; line-height:1.6; white-space:pre;
  }

  .choicegrid{display:grid; grid-template-columns:repeat(auto-fill, minmax(200px,1fr)); gap:10px;}
  .choicebtn{
    font-family:var(--font-mono); font-size:.9rem; text-align:left;
    background:var(--bg-2); color:var(--ink); border:1px solid var(--line); padding:12px 14px; cursor:pointer;
    clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
    transition:background .15s ease, border-color .15s ease;
  }
  .choicebtn:hover:not(:disabled){background:var(--panel-2); border-color:var(--accent);}
  .choicebtn:disabled{opacity:.6; cursor:default;}

  .feedback{padding:18px 20px; margin-bottom:16px; font-size:.92rem;}
  .feedback .head{font-weight:700; margin-bottom:10px; font-size:1rem;}
  .feedback.good .head{color:var(--hero);}
  .feedback.bad .head{color:var(--danger);}
  .feedback .yourans, .feedback .correctans{margin:0 0 10px; display:flex; gap:8px; align-items:baseline; flex-wrap:wrap;}
  .feedback .label{font-size:.75rem; color:var(--ink-dim); letter-spacing:.06em; text-transform:uppercase; flex:none;}
  .feedback .chip{font-family:var(--font-mono); background:var(--bg-2); border:1px solid var(--line); padding:2px 8px; border-radius:3px;}
  .feedback .explain{margin:12px 0 0; color:var(--ink); border-top:1px dashed var(--line); padding-top:12px;}
  .feedback .explain .tag{display:block; font-size:.72rem; color:var(--accent); letter-spacing:.1em; text-transform:uppercase; margin-bottom:6px;}

  .primary{
    font-family:var(--font-body); font-weight:600; font-size:.95rem;
    background:var(--accent); color:var(--accent-ink); border:none; padding:11px 22px; cursor:pointer;
    clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
  }
  .primary:hover:not(:disabled){filter:brightness(1.06);}
  .primary:disabled{opacity:.5; cursor:default;}
  .actionrow{display:flex; justify-content:flex-end; gap:10px; flex-wrap:wrap;}

  .shake{animation:shake .35s ease;}
  @keyframes shake{
    10%,90%{transform:translateX(-1px);} 20%,80%{transform:translateX(2px);}
    30%,50%,70%{transform:translateX(-4px);} 40%,60%{transform:translateX(4px);}
  }
  .pulse{animation:pulse .4s ease;}
  @keyframes pulse{0%{filter:brightness(1);}40%{filter:brightness(1.35);}100%{filter:brightness(1);}}

  /* ---- result screen ---- */
  .result{padding:34px 30px; text-align:center;}
  .result .bigemoji{font-size:3rem; display:block; margin-bottom:6px;}
  .result h2{font-size:1.5rem; margin-bottom:6px;}
  .result .starsline{font-size:1.6rem; color:var(--accent); margin:10px 0 14px; letter-spacing:.1em;}
  .result p{color:var(--ink-dim); max-width:48ch; margin:0 auto 20px;}
  .resultbtns{display:flex; justify-content:center; gap:12px; flex-wrap:wrap;}
  .ghost{
    font-family:var(--font-body); font-size:.9rem; color:var(--ink); background:none;
    border:1px solid var(--line); padding:10px 20px; cursor:pointer;
    clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
  }
  .ghost:hover{border-color:var(--accent);}

  .allclear{padding:30px; text-align:center; margin-top:20px;}
  .footer-note{text-align:center; color:var(--ink-dim); font-size:.78rem; margin-top:30px;}
</style>

<div class="stage" id="app"></div>

<script>
(function(){
  "use strict";

  /*
   lesson         : 戦闘の前に読む「訓練場」の例題(完成済みコード+解説)。
   before / after : 空欄問題のコード片(改行は\nで表現)。この間に空欄(______)が入る。
   answers        : 正解として受け付ける入力(複数可)。空白の有無・大小文字は自動で吸収する。
   explain        : 完全初学者向けの解説。
  */
  var BASE_STAGES = [
    {id:'w1', title:'入出力の間', sub:'Week1 C++の入出力', emoji:'👺', mon:'出力ゴブリン',
      lesson:[
        {title:'画面に文字を出す', code:'#include <iostream>\nusing namespace std;\nint main(){\n  cout << "Hello World!" << endl;\n}',
         explain:'coutは画面(コンソール)に文字を出すための「出力ストリーム」というオブジェクトです。ストリームとは「データが流れる川」のようなイメージで、coutは「画面という川の出口」だと考えるとわかりやすいです。<<(出力演算子)を使って、coutの右側に出したい値をどんどんつなげていくと、その値が左から順番に画面に表示されます。この例では文字列"Hello World!"のあとにendlが続いていますが、endlは改行をしたうえで、プログラムが一時的にためている出力データ(バッファ)を確実に画面に反映させる働きをします。C++のプログラムはmain関数の中に書かれた命令が上から順番に実行されるので、この1行が実行された瞬間に画面に文字が現れます。'},
        {title:'表示形式を変えるマニピュレータ', code:'cout << hex << 255 << endl; // ff\ncout << dec << 255 << endl; // 255',
         explain:'hex, oct, decは「マニピュレータ」と呼ばれる特別な単語で、coutに<<でつなぐと、その後ろに続く数値の見た目(表示形式)を切り替えることができます。普段私たちが使っている0〜9の数字の数え方が10進数(dec)、0〜7だけを使うのが8進数(oct)、0〜9とa〜fを使うのが16進数(hex)です。コンピュータの内部ではすべて2進数(0と1)でデータが扱われていますが、2進数は人間には読みにくいため、プログラムでは16進数がよく使われます(4桁の2進数がちょうど16進数の1桁に対応するため、読み替えがしやすいのです)。マニピュレータは出力(cout)だけでなく、cin >> hex >> n; のように入力(cin)にもつけることができ、キーボードから入力された文字列を指定した形式の数値として読み取ってくれます。一度hexを指定すると、その後は指定し直すまでずっとその形式が続く点にも注意しましょう。'},
        {title:'std::を省略する', code:'using namespace std;\n// これ以降 std:: を省略できる\ncout << "Hi" << endl;',
         explain:'C++の標準ライブラリにあるcoutやendlは、正式にはstd::cout、std::endlのように「std::」という接頭辞をつけて書く必要があります。これはcoutやendlがstdという「名前空間(namespace)」に属しているからです。名前空間は、たくさんの人が作ったプログラム部品を組み合わせて使うときに、同じ名前の関数や変数がぶつかってしまわないように整理する「引き出し」や「タグ」のようなものだと考えてください。毎回std::と書くのは面倒なので、プログラムの先頭で using namespace std; と宣言しておくと、それ以降はstd名前空間にあるものをstd::なしでそのまま書けるようになります。ただし大きなプログラムでは複数のライブラリで同じ名前が使われて衝突する可能性があるため、using namespace stdを使わずに毎回std::をつけて書くスタイルが好まれることもあります。'}
      ],
      qs:[
        {before:'int main(){\n  ', after:' << "Hello World!" << endl;\n}',
         answers:['cout','std::cout'],
         explain:'coutはC++が標準で用意している「出力ストリーム」というオブジェクトです。画面(コンソール)に文字や数値を出すための窓口だと考えてください。coutの後ろに<<(出力演算子)をつけて出したい値を書くと、その値が画面に表示されます。<<は複数つなげることもでき、cout << "a" << "b" << endl; のように書けば"a"と"b"が続けて表示されます。もしプログラムの先頭で using namespace std; を書いていなければ、std::cout << ... と、std::をつけて書く必要がある点も覚えておきましょう。cOutのように綴りを間違えるとコンパイルエラーになるので、正確に小文字で cout と書くことが大切です。'},
        {before:'#include <', after:'>\nusing namespace std;\nint main(){\n  cout << "Hi" << endl;\n}',

  function buildBossStage(group){
    var srcStages = group.ids.map(function(i){ return BASE_STAGES[i]; });
    var lesson = [];
    srcStages.forEach(function(st){
      st.lesson.forEach(function(item){
        lesson.push({title:'『'+st.title+'』'+item.title, code:item.code, explain:item.explain});
      });
    });
    var qs = [];
    srcStages.forEach(function(st){ qs = qs.concat(st.qs); });
    qs = qs.concat(BOSS_LONG_QS[group.id] || []);
    return {id:group.id, title:group.title, sub:group.sub, emoji:group.emoji, mon:group.mon, isBoss:true, lesson:lesson, qs:qs};
  }

  var ENDLESS_POOL = [];
  BASE_STAGES.forEach(function(st){
    st.qs.forEach(function(q){ ENDLESS_POOL.push({q:q, srcTitle:st.title, srcSub:st.sub}); });
    (st.qsHard||[]).forEach(function(q){ ENDLESS_POOL.push({q:q, srcTitle:st.title, srcSub:st.sub+' ・ 難問'}); });

  BOSS_GROUPS.forEach(function(group){

    return {unlocked:1, stars:{}};

  var progress = loadProgress();
  if(!progress.endless || !Array.isArray(progress.endless.queue)){
    progress.endless = {queue:[], pos:0, correct:0, wrong:0, streak:0, bestStreak:0};
  }
  if(!progress.settings){
    progress.settings = {allowAlt:false};
  }

  function ensureEndlessQueue(){
    if(progress.endless.queue.length !== ENDLESS_POOL.length){
      progress.endless.queue = shuffle(ENDLESS_POOL.map(function(_,i){return i;}));
      progress.endless.pos = 0;
    }
  }
  function reshuffleEndlessQueue(){
    var q = progress.endless.queue;
    var lastIdx = q.length ? q[q.length-1] : -1;
    var next = shuffle(ENDLESS_POOL.map(function(_,i){return i;}));
    if(next.length>1 && next[0]===lastIdx){
      var tmp=next[0]; next[0]=next[1]; next[1]=tmp;
    }
    progress.endless.queue = next;
    progress.endless.pos = 0;
  }

  function shuffle(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var t=a[i]; a[i]=a[j]; a[j]=t;
    }
    return a;
  }

  function esc(s){
    return String(s).replace(/[&<>]/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});
  }

  var FULLWIDTH_MAP = {
    '＊':'*','＋':'+','－':'-','＜':'<','＞':'>','／':'/','＆':'&','（':'(','）':')',
    '：':':','；':';','＿':'_','．':'.','，':',','　':' ','％':'%','＝':'=','！':'!',
    '”':'"','“':'"','’':"'",'‘':"'",'〜':'~','～':'~'
  };
  function toHalfWidth(s){
    return String(s).replace(/[Ａ-Ｚａ-ｚ０-９]/g, function(c){
      return String.fromCharCode(c.charCodeAt(0)-0xFEE0);
    }).replace(/[＊＋－＜＞／＆（）：；＿．，　％＝！”“’‘〜～]/g, function(c){
      return FULLWIDTH_MAP[c];
    });
  }
  function normalize(s){
    return toHalfWidth(String(s)).trim().toLowerCase().replace(/\s+/g,'');
  }
  function stripSemi(s){
    return s.replace(/[;。、]+$/,'');
  }
  function stripStd(s){
    return s.replace(/^std::/,'');
  }
  function checkAnswer(input, answers){
    var n = normalize(input);
    var n2 = stripSemi(n);
    var n3 = stripStd(n2);
    return answers.some(function(a){
      var an = normalize(a);
      var an2 = stripSemi(an);
      var an3 = stripStd(an2);
      return n===an || n2===an2 || n3===an3;
    });
  }

    return ''+
    '<div class="topbar">'+
      '<div class="brand"><span class="glyph">🧙</span><div><h1>コード転生記</h1><small>期末試験サバイバル・クエスト</small></div></div>'+
      '<div class="tally">総獲得星 <span class="stars num">'+totalStarsEarned()+' / '+TOTAL_STARS+'</span></div>'+
    '</div>';
  }

  var SECTION_TITLES = [
    '第1部 C++入門 ― 入出力・ポインタ・関数',
    '第2部 データ構造 ― 配列・文字列・構造体',
    '第3部 クラス設計 ― 基本から後片付けまで',
    '第4部 継承と多態性',
    '第5部 Pythonへの転生 ― クラスとTkinter'
  ];

  function renderMap(){
    var sectionsHtml = '';
    var sectionIdx = 0;
    var cardsBuf = [];
    function flushSection(){
      if(cardsBuf.length){
        sectionsHtml += '<h3 class="groupheading">'+esc(SECTION_TITLES[sectionIdx] || ('第'+(sectionIdx+1)+'部'))+'</h3>'+
          '<div class="stagegrid">'+cardsBuf.join('')+'</div>';
        cardsBuf = [];
      }
    }
    STAGES.forEach(function(st, i){
      var stars = progress.stars[st.id] || 0;
      cardsBuf.push(''+
        '<button class="stagecard'+(st.isBoss?' boss':'')+'" data-idx="'+i+'" aria-label="'+esc(st.title)+'">'+
          '<div class="row1"><span class="emoji">'+st.emoji+'</span><span class="idx">'+(st.isBoss?'★ BOSS ★':'STAGE '+(i+1))+'</span></div>'+
          '<h3>'+esc(st.title)+'</h3>'+
          '<div class="sub">'+esc(st.sub)+' ・ '+esc(st.mon)+'</div>'+
          '<div class="stars">'+starString(stars)+'</div>'+
        '</button>');
      if(st.isBoss){ flushSection(); sectionIdx++; }
    });
    flushSection();

    var e = progress.endless;
    var totalAns = e.correct + e.wrong;
    var acc = totalAns>0 ? Math.round(e.correct/totalAns*100) : 0;

    return ''+ renderTopbar() +
    '<div class="frame intro">'+
      '<h2>試験前夜、記憶の迷宮へ</h2>'+
      '<p>全'+STAGES.length+'章(通常'+BASE_STAGES.length+'章+ボス'+BOSS_GROUPS.length+'体)。各章にはまず「訓練場」があり、完成した正しいコードと解説を読んで感覚をつかめる。準備ができたら難易度(初級/中級/上級)を選んで、記述式・選択式・並べ替えなど様々な形式の設問に挑もう。まとまりを1つ終えるごとに総復習のボスが待ち構えている。</p>'+
    '</div>'+
    '<button class="frame alttoggle" id="btnAltToggle" aria-pressed="'+(progress.settings.allowAlt?'true':'false')+'">'+
      '<span class="alticon">'+(progress.settings.allowAlt?'🔓':'🔒')+'</span>'+
      '<span class="altbody">'+
        '<span class="alttitle">別解モード: '+(progress.settings.allowAlt?'ON':'OFF')+'</span>'+
        '<span class="altdesc">'+(progress.settings.allowAlt
          ? '授業で扱っていない書き方(別解)も正解として受け付け中。クリックでOFFに戻せます。'
          : '一部の設問には、授業で扱っていない別解にも対応した採点があります。ONにすると、それらの別解も正解として受け付けます。')+
        '</span>'+
      '</span>'+
    '</button>'+
    '<button class="frame endlesscard" id="btnEndless" aria-label="総学習モードを開始する">'+
      '<div class="endlesscard-head">'+
        '<span class="emoji">📚</span>'+
        '<div><h3>総学習モード(エンドレス)</h3>'+
        '<div class="sub">全'+ENDLESS_POOL.length+'問のプールから尽きるまで出題され続ける総復習モード。1週間の勉強量でも解き切れないボリュームで、繰り返すほど手薄な単元をあぶり出せる。</div></div>'+
      '</div>'+
      '<div class="endlesscard-stats">'+
        '<span>連続正解 <b>'+e.streak+'</b>(最高'+e.bestStreak+')</span>'+
        '<span>通算正答率 <b>'+e.correct+' / '+totalAns+'</b>('+acc+'%)</span>'+
      '</div>'+
    '</button>'+
    sectionsHtml+
    '<p class="footer-note">進行状況はこの端末に自動保存されます。</p>';
  }

  function openLesson(idx, fromBattle){
    state.stageIndex = idx;
    state.screen = 'lesson';
    state.lessonFromBattle = !!fromBattle;
    render();
  }

  function renderLesson(){
    var st = STAGES[state.stageIndex];
    var cards = st.lesson.map(function(c, i){
      return '<div class="frame lessoncard">'+
        '<div class="lstep">例題 '+(i+1)+' / '+st.lesson.length+'</div>'+
        '<h3>'+esc(c.title)+'</h3>'+
        '<pre class="codeblock">'+esc(c.code)+'</pre>'+
        '<p class="lessonexplain">'+esc(c.explain)+'</p>'+
      '</div>';
    }).join('');

    var backLabel = state.lessonFromBattle ? '← 戦闘へ戻る' : '← 地図へ戻る';

    var actionHtml;
    if(state.lessonFromBattle){
      actionHtml = '<div class="actionrow"><button class="primary" id="btnToBattle">戦いに戻る →</button></div>';
    } else {
      var hasHard = !!(st.qsHard && st.qsHard.length);
      actionHtml = '<div class="frame diffpick">'+
        '<div class="difftitle">難易度を選んで'+esc(st.mon)+'に挑もう</div>'+
        '<div class="diffrow">'+
          '<button class="diffbtn" data-diff="easy"><span class="dname">🌱 初級</span><span class="ddesc">被ダメージ控えめ。まずは操作と考え方に慣れたい人向け。</span></button>'+
          '<button class="diffbtn" data-diff="normal"><span class="dname">⚔️ 中級</span><span class="ddesc">通常の設問セットで正面から挑む。</span></button>'+
          '<button class="diffbtn'+(hasHard?'':' diffbtn-off')+'" data-diff="hard"><span class="dname">🔥 上級</span><span class="ddesc">'+(hasHard?'章専用の難問セット。被ダメージも大きい玄人向け。':'この章の難問は準備中(通常セットに挑戦できます)')+'</span></button>'+
        '</div>'+
      '</div>';
    }

    return ''+ renderTopbar() +
    '<div class="battlebar"><button class="backbtn" id="btnLessonBack">'+backLabel+'</button></div>'+
    '<div class="frame lessonintro">'+
      '<h2>'+st.emoji+' 訓練場 — '+esc(st.title)+'</h2>'+
      '<p>'+esc(st.sub)+'の要点を、完成した正しいコードと解説で確認しよう。まずは読んで感覚をつかんでから、'+esc(st.mon)+'に挑むと理解しやすい。</p>'+
    '</div>'+
    '<div class="lessongrid">'+cards+'</div>'+
    actionHtml;
  }

  function startStage(idx, difficulty){
    var st = STAGES[idx];
    state.difficulty = difficulty || state.difficulty || 'normal';
    state.activeQs = (state.difficulty==='hard' && st.qsHard && st.qsHard.length) ? st.qsHard : st.qs;
    state.screen='battle';
    state.stageIndex=idx;
    state.order = shuffle(state.activeQs.map(function(_,i){return i;}));
    state.qIndex=0;
    state.heroHP=100;
    state.monsterHP=100;
    state.wrong=0;
    state.locked=false;
    state.failReason=null;
    render();
  }

  function openEndless(){
    ensureEndlessQueue();
    CUR_Q = null;
    state.locked = false;
    state.screen = 'endless';
    render();
  }

  function currentEndlessQuestion(){
    var idx = progress.endless.queue[progress.endless.pos];
    return ENDLESS_POOL[idx];
  }

  var CUR_Q = null;

  function currentQuestion(){
    var qi = state.order[state.qIndex];
    return state.activeQs[qi];
  }

  var QLEAD_DEFAULT = {
    fill:'空欄(<span style="color:var(--accent);font-weight:700;">______</span>)に入るコードや単語を実際に入力して、呪文のように唱えよう。',
    debug:'🐛 このコードには誤りが1箇所ある。正しく直した内容を入力して唱えよう。',
    choice:'次のうち正しいものを選んで唱えよう。',
    order:'正しい順番になるように、記号をカンマ区切りで入力して唱えよう(例: B,A,C)。'
  };

  function renderQuestionBody(q){
    var type = q.type || 'fill';
    var qlead = q.lead || QLEAD_DEFAULT[type];

    var bodyHtml;
    if(type==='order'){
      var linesText = q.lines.map(function(ln){ return ln.label+' : '+ln.code; }).join('\n');
      bodyHtml = '<pre class="codeblock">'+esc(linesText)+'</pre>';
    } else if(type==='choice'){
      bodyHtml = q.code ? '<pre class="codeblock">'+esc(q.code)+'</pre>' : '';
    } else {
      bodyHtml = '<pre class="codeblock">'+esc(q.before)+'<mark class="blank">______</mark>'+esc(q.after)+'</pre>';
    }

    var answerHtml;
    if(type==='choice'){
      answerHtml = '<div class="choicegrid" id="choiceGrid">'+
        q.options.map(function(opt,i){
          return '<button class="choicebtn" data-opt="'+i+'">'+esc(opt)+'</button>';
        }).join('')+
      '</div>';
    } else if(q.long){
      answerHtml = '<div class="answerrow long">'+
        '<textarea class="codeinput long" id="ansInput" rows="6" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="ここに複数行のコードを入力…(Enterで改行できます)"></textarea>'+
      '</div>'+
      '<div class="actionrow"><button class="primary" id="btnSubmit">詠唱する →</button></div>';
    } else {
      answerHtml = '<div class="answerrow">'+
        '<input class="codeinput" id="ansInput" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="ここにコードを入力…">'+
        '<button class="primary" id="btnSubmit">詠唱する →</button>'+
      '</div>';
    }
    return {qlead:qlead, bodyHtml:bodyHtml, answerHtml:answerHtml};
  }

  function renderBattle(){
    var st = STAGES[state.stageIndex];
    if(!CUR_Q) CUR_Q = currentQuestion();
    var total = state.activeQs.length;
    var qb = renderQuestionBody(CUR_Q);

    return ''+ renderTopbar() +
    '<div class="battlebar">'+
      '<button class="backbtn" id="btnHome">← 地図へ戻る</button>'+
      '<button class="backbtn" id="btnReview">📖 訓練場で例題を見直す</button>'+
    '</div>'+
    '<div class="combatants">'+
      '<div class="frame fighter"><div class="who"><span class="emoji">🧙</span><div class="name">受験の勇者<small>あなた</small></div></div>'+
        '<div class="hpbar hero"><i style="transform:scaleX('+(state.heroHP/100)+')"></i></div>'+
        '<div class="hpnum"><span>HP</span><span class="num">'+state.heroHP+' / 100</span></div></div>'+
      '<div class="vs">VS</div>'+
      '<div class="frame fighter"><div class="who"><span class="emoji">'+st.emoji+'</span><div class="name">'+esc(st.mon)+'<small>'+esc(st.sub)+'</small></div></div>'+
        '<div class="hpbar monster"><i style="transform:scaleX('+(state.monsterHP/100)+')"></i></div>'+
        '<div class="hpnum"><span>HP</span><span class="num">'+state.monsterHP+' / 100</span></div></div>'+
    '</div>'+
    '<div class="frame qcard" id="qcard">'+
      '<div class="qmeta"><span>設問 '+(state.qIndex+1)+' / '+total+'</span><span>'+esc(st.title)+(state.difficulty? ' ・ '+DIFF_LABEL[state.difficulty] : '')+'</span></div>'+
      '<div class="qlead">'+qb.qlead+'</div>'+
      qb.bodyHtml+
      qb.answerHtml+
    '</div>'+
    '<div id="feedbackSlot"></div>';
  }

  function renderEndless(){
    if(!CUR_Q){
      var cur = currentEndlessQuestion();
      CUR_Q = cur.q;
      state.endlessSrc = cur;
    }
    var qb = renderQuestionBody(CUR_Q);
    var e = progress.endless;
    var total = e.correct + e.wrong;
    var acc = total>0 ? Math.round(e.correct/total*100) : 0;

    return ''+ renderTopbar() +
    '<div class="battlebar"><button class="backbtn" id="btnHome">← 地図へ戻る</button></div>'+
    '<div class="frame endlessbar">'+
      '<div class="estat"><span class="elabel">出題元</span><span class="evalue">'+esc(state.endlessSrc.srcTitle)+'</span></div>'+
      '<div class="estat"><span class="elabel">連続正解</span><span class="evalue">'+e.streak+'(最高'+e.bestStreak+')</span></div>'+
      '<div class="estat"><span class="elabel">通算正答率</span><span class="evalue">'+e.correct+' / '+total+'('+acc+'%)</span></div>'+
      '<div class="estat"><span class="elabel">プール残数</span><span class="evalue">'+(progress.endless.queue.length - progress.endless.pos)+' / '+ENDLESS_POOL.length+'</span></div>'+
    '</div>'+
    '<div class="frame qcard" id="qcard">'+
      '<div class="qmeta"><span>総学習モード(エンドレス)</span><span>'+esc(state.endlessSrc.srcSub)+'</span></div>'+
      '<div class="qlead">'+qb.qlead+'</div>'+
      qb.bodyHtml+
      qb.answerHtml+
    '</div>'+
    '<div id="feedbackSlot"></div>';
  }

  function renderResult(win){
    var st = STAGES[state.stageIndex];
    var stars = 1;
    if(win){
      var ratio = state.heroHP/100;
      if(state.wrong===0) stars=3;
      else if(ratio>=0.5) stars=2;
      else stars=1;
      var prev = progress.stars[st.id]||0;
      if(stars>prev) progress.stars[st.id]=stars;
      if(state.stageIndex+2 > progress.unlocked) progress.unlocked = state.stageIndex+2;
      if(progress.unlocked > STAGES.length) progress.unlocked = STAGES.length;
      saveProgress(progress);
    }
    var failMsg = state.failReason==='outofq'
      ? ('<span class="bigemoji">🌀</span><h2>とどめを刺しきれなかった…</h2><p>設問はすべて解き終えたが、'+esc(st.mon)+'にはまだ息がある。誤答が多いと決定打が足りない。訓練場で復習してもう一度挑もう。</p>')
      : ('<span class="bigemoji">💤</span><h2>力尽きた…</h2><p>'+esc(st.mon)+'にHPを削り切られてしまった。訓練場で復習してもう一度挑もう。</p>');
    var body = win ?
      ('<span class="bigemoji">🏆</span><h2>'+esc(st.mon)+'を撃破した！</h2><div class="starsline">'+starString(stars)+'</div><p>誤答'+state.wrong+'回で切り抜けた。単元「'+esc(st.sub)+'」はもう怖くない。</p>')
      : failMsg;

    var nextIdx = state.stageIndex+1;
    var hasNext = win && nextIdx < STAGES.length;

    return ''+ renderTopbar() +
    '<div class="frame result">'+
      body+
      '<div class="resultbtns">'+
        '<button class="ghost" id="btnReview">📖 訓練場で見直す</button>'+
        '<button class="ghost" id="btnRetry">'+(win?'もう一度挑む':'再挑戦する')+'</button>'+
        (hasNext? '<button class="primary" id="btnNext">次の間へ進む →</button>' : '')+
        '<button class="ghost" id="btnMap">地図へ戻る</button>'+
      '</div>'+
    '</div>'+
    (!hasNext && win && nextIdx>=STAGES.length ? '<div class="frame allclear"><h2>🎉 全'+STAGES.length+'章 制覇！</h2><p>期末試験の範囲をひと通り旅した。総獲得星 <span class="num">'+totalStarsEarned()+' / '+TOTAL_STARS+'</span>。仕上げにもう一周して星を集めよう。</p></div>' : '');
  }

  function wireQuestionControls(app){
    if((CUR_Q.type||'fill')==='choice'){
      Array.prototype.forEach.call(app.querySelectorAll('.choicebtn'), function(btn){
        btn.addEventListener('click', function(){ onChoice(parseInt(btn.getAttribute('data-opt'),10)); });
      });
    } else {
      var input = document.getElementById('ansInput');
      var submitBtn = document.getElementById('btnSubmit');
      submitBtn.addEventListener('click', onSubmit);
      if(input.tagName !== 'TEXTAREA'){
        input.addEventListener('keydown', function(e){
          if(e.key==='Enter'){ e.preventDefault(); onSubmit(); }
        });
      }
      input.focus();
    }
  }

  function render(){
    var app = document.getElementById('app');
    if(state.screen==='map'){
      app.innerHTML = renderMap();
      Array.prototype.forEach.call(app.querySelectorAll('.stagecard:not(.locked)'), function(btn){
        btn.addEventListener('click', function(){
          CUR_Q = null;
          openLesson(parseInt(btn.getAttribute('data-idx'),10), false);
        });
      });
      document.getElementById('btnEndless').addEventListener('click', function(){
        openEndless();
      });
      document.getElementById('btnAltToggle').addEventListener('click', function(){
        progress.settings.allowAlt = !progress.settings.allowAlt;
        saveProgress(progress);
        render();
      });
    } else if(state.screen==='lesson'){
      app.innerHTML = renderLesson();
      document.getElementById('btnLessonBack').addEventListener('click', function(){
        state.screen = state.lessonFromBattle ? 'battle' : 'map';
        render();
      });
      var toBattleBtn = document.getElementById('btnToBattle');
      if(toBattleBtn){
        toBattleBtn.addEventListener('click', function(){ state.screen='battle'; render(); });
      }
      Array.prototype.forEach.call(app.querySelectorAll('.diffbtn'), function(btn){
        btn.addEventListener('click', function(){
          startStage(state.stageIndex, btn.getAttribute('data-diff'));
        });
      });
    } else if(state.screen==='battle'){
      app.innerHTML = renderBattle();
      document.getElementById('btnHome').addEventListener('click', function(){
        CUR_Q=null; state.screen='map'; render();
      });
      document.getElementById('btnReview').addEventListener('click', function(){
        openLesson(state.stageIndex, true);
      });
      wireQuestionControls(app);
    } else if(state.screen==='endless'){
      app.innerHTML = renderEndless();
      document.getElementById('btnHome').addEventListener('click', function(){
        CUR_Q=null; state.screen='map'; render();
      });
      wireQuestionControls(app);
    } else if(state.screen==='result-win' || state.screen==='result-lose'){
      var win = state.screen==='result-win';
      app.innerHTML = renderResult(win);
      var review = document.getElementById('btnReview');
      if(review) review.addEventListener('click', function(){ CUR_Q=null; openLesson(state.stageIndex, false); });
      var retry = document.getElementById('btnRetry');
      if(retry) retry.addEventListener('click', function(){ CUR_Q=null; startStage(state.stageIndex); });
      var next = document.getElementById('btnNext');
      if(next) next.addEventListener('click', function(){ CUR_Q=null; startStage(state.stageIndex+1); });
      var map = document.getElementById('btnMap');
      if(map) map.addEventListener('click', function(){ CUR_Q=null; state.screen='map'; render(); });
    }
  }

  function onSubmit(){
    if(state.locked) return;
    var input = document.getElementById('ansInput');
    var val = input.value;
    if(!val.trim()){
      input.classList.add('shake');
      setTimeout(function(){ input.classList.remove('shake'); }, 350);
      input.focus();
      return;
    }
    input.disabled = true;
    document.getElementById('btnSubmit').disabled = true;
    resolveAnswer(val);
  }

  function onChoice(idx){
    if(state.locked) return;
    Array.prototype.forEach.call(document.querySelectorAll('.choicebtn'), function(b){ b.disabled = true; });
    resolveAnswer(CUR_Q.options[idx]);
  }

  function resolveAnswer(val){
    state.locked = true;

    var isEndless = state.screen==='endless';
    var answerPool = (progress.settings.allowAlt && CUR_Q.altAnswers && CUR_Q.altAnswers.length)
      ? CUR_Q.answers.concat(CUR_Q.altAnswers) : CUR_Q.answers;
    var correct = checkAnswer(val, answerPool);
    var slot = document.getElementById('feedbackSlot');
    var qcard = document.getElementById('qcard');

    if(isEndless){
      if(correct){
        progress.endless.correct++;
        progress.endless.streak++;
        if(progress.endless.streak > progress.endless.bestStreak) progress.endless.bestStreak = progress.endless.streak;
        qcard.classList.add('pulse');
      } else {
        progress.endless.wrong++;
        progress.endless.streak = 0;
        qcard.classList.add('shake');
      }
      saveProgress(progress);
    } else {
      var dmgToMonster = Math.ceil(100/state.activeQs.length);
      var wrongDmg = state.difficulty==='hard' ? 25 : (state.difficulty==='easy' ? 14 : 20);
      if(correct){
        state.monsterHP = Math.max(0, state.monsterHP - dmgToMonster);
        qcard.classList.add('pulse');
      } else {
        state.wrong++;
        state.heroHP = Math.max(0, state.heroHP - wrongDmg);
        qcard.classList.add('shake');
      }
    }

    var yourAnsChip = '<div class="yourans"><span class="label">あなたの回答</span><span class="chip">'+esc(val)+'</span></div>';
    var correctAnsChip = correct ? '' : '<div class="correctans"><span class="label">正解例</span><span class="chip">'+esc(CUR_Q.answers.join(' / '))+'</span></div>';

    slot.innerHTML = ''+
      '<div class="frame feedback '+(correct?'good':'bad')+'">'+
        '<div class="head">'+(correct? '⚔️ 会心の一撃！' : '💥 手痛い反撃を受けた…')+'</div>'+
        yourAnsChip+
        correctAnsChip+
        '<div class="explain"><span class="tag">解説</span>'+esc(CUR_Q.explain)+'</div>'+
      '</div>'+
      '<div class="actionrow"><button class="primary" id="btnContinue">つづける →</button></div>';

    if(!isEndless) setTimeout(refreshBars, 30);

    document.getElementById('btnContinue').addEventListener('click', function(){
      CUR_Q = null;
      if(isEndless){
        progress.endless.pos++;
        if(progress.endless.pos >= progress.endless.queue.length){
          reshuffleEndlessQueue();
        }
        saveProgress(progress);
        state.locked = false;
        render();
        return;
      }
      if(state.heroHP<=0){ state.failReason='hero'; state.screen='result-lose'; render(); return; }
      if(state.monsterHP<=0){ state.screen='result-win'; render(); return; }
      state.qIndex++;
      if(state.qIndex >= state.order.length){
        if(state.monsterHP<=0){ state.screen='result-win'; }
        else { state.failReason='outofq'; state.screen='result-lose'; }
        render();
        return;
      }
      state.locked = false;
      render();
    });
  }

  function refreshBars(){
    var heroBar = document.querySelector('.hpbar.hero i');
    var monBar = document.querySelector('.hpbar.monster i');
    if(heroBar) heroBar.style.transform = 'scaleX('+(state.heroHP/100)+')';
    if(monBar) monBar.style.transform = 'scaleX('+(state.monsterHP/100)+')';
    var nums = document.querySelectorAll('.hpnum .num');
    if(nums[0]) nums[0].textContent = state.heroHP+' / 100';
    if(nums[1]) nums[1].textContent = state.monsterHP+' / 100';
  }

  render();
})();
</script>
