<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>コード事件捜査局 — 期末試験ファイル</title>
  <link rel="stylesheet" href="css/main.css?v=2026072222e">
<link rel="stylesheet" href="css/gamification.css?v=2026072222e">
<link rel="stylesheet" href="css/investigation.css?v=2026072222e">
</head>
<body class="performance-mode">
<div class="stage" id="app"><div class="frame" id="bootStatus" style="padding:18px 20px;">捜査画面を読み込んでいます…</div></div>

<script>
  var CURRENT_MODULE_URL = './dist/app-2026072222k.js?v=20260722-dropcase11';

  (async function(){
    try{
      var module = await import('./dist/app-2026072222k.js?v=20260722-dropcase11');
      module.boot();
    }catch(error){
      console.error('アプリの起動に失敗しました', error);
      var app = document.getElementById('app');
      app.innerHTML = '';
      var panel = document.createElement('div');
      panel.className = 'frame';
      panel.style.padding = '20px';
      var title = document.createElement('h2');
      title.textContent = '画面を読み込めませんでした';
      var message = document.createElement('p');
      message.textContent = '古いファイルが残っている可能性があります。下のボタンで最新版を読み込み直してください。';
      var button = document.createElement('button');
      button.className = 'primary';
      button.textContent = '最新版を読み込み直す';
      button.addEventListener('click', function(){
        var url = new URL(location.href);
        url.searchParams.set('reload', Date.now());
        location.replace(url.toString());
      });
      panel.append(title, message, button);
      app.appendChild(panel);
    }
  })();

  /* このページ自体がブラウザ/CDNにキャッシュされたままだと、サーバー側を
     更新してもタブを開きっぱなしの利用者には反映されない。定期的に
     no-storeで自分自身を取り直し、読み込みスクリプトのURLが変わっていたら
     更新を促す(強制リロードはせず、ボタンを押した時だけ更新する)。 */
  function extractModuleUrl(html){
    var m = html.match(/import\(['"]([^'"]+)['"]\)/);
    return m ? m[1] : null;
  }
  function showUpdateBanner(){
    if(document.getElementById('updateBanner')) return;
    var bar = document.createElement('div');
    bar.id = 'updateBanner';
    bar.style.cssText = 'position:fixed;left:0;right:0;bottom:0;background:#1b140f;color:#f3e6cf;padding:12px 16px;display:flex;gap:12px;align-items:center;justify-content:center;font-size:14px;z-index:9999;box-shadow:0 -4px 16px rgba(0,0,0,.35);flex-wrap:wrap;';
    var span = document.createElement('span');
    span.textContent = '新しいバージョンがあります。';
    var reloadBtn = document.createElement('button');
    reloadBtn.textContent = '更新する';
    reloadBtn.style.cssText = 'background:#8a2f2f;color:#fff;border:none;border-radius:6px;padding:7px 16px;cursor:pointer;font-size:14px;';
    reloadBtn.addEventListener('click', function(){ location.reload(); });
    var laterBtn = document.createElement('button');
    laterBtn.textContent = 'あとで';
    laterBtn.style.cssText = 'background:transparent;color:#f3e6cf;border:1px solid #6b5c48;border-radius:6px;padding:7px 16px;cursor:pointer;font-size:14px;';
    laterBtn.addEventListener('click', function(){ bar.remove(); });
    bar.append(span, reloadBtn, laterBtn);
    document.body.appendChild(bar);
  }
  function checkForUpdate(){
    fetch(location.pathname, { cache: 'no-store' })
      .then(function(res){ return res.text(); })
      .then(function(html){
        var latest = extractModuleUrl(html);
        if(latest && latest !== CURRENT_MODULE_URL) showUpdateBanner();
      })
      .catch(function(){});
  }
  document.addEventListener('visibilitychange', function(){
    if(!document.hidden) checkForUpdate();
  });
  window.addEventListener('focus', checkForUpdate);
  setInterval(checkForUpdate, 3*60*1000);
</script>

</body>
</html>
